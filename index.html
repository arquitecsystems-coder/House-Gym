      <button onclick="saveEditModal()" style="flex:2;padding:11px;border:none;border-radius:8px;background:var(--accent2);color:#fff;font-weight:700;cursor:pointer;font-family:var(--font)">Guardar y recalcular</button>
    </div>
  </div>`;

  document.body.appendChild(modal);
}

function closeEditModal() {
  const m = document.getElementById('editModal');
  if (m) m.remove();
}

function saveEditModal() {
  const datos = getCutDatos();
  const s = datos.setup;
  const get = id => parseFloat(document.getElementById(id)?.value);
  const getString = id => document.getElementById(id)?.value;

  const pesoNoche = get('ed_pesoNoche') || s.pesoNoche;
  const pesoAyunas = get('ed_pesoAyunas') || s.pesoAyunas;
  const pctTarget = get('ed_pctTarget') || s.pctTarget;
  const ganMus = get('ed_ganMus') || s.ganMus;
  const cals = get('ed_cals') || s.cals;
  const fecha = getString('ed_fecha') || s.fechaInicio;
  const edad = s.edad || 24;

  const pliegues = PLIEGUES_NAMES.map((_,i) => get('ed_pl_'+i) || s.plieguesIniciales?.[i] || 0);
  const cintura = get('ed_cintura') || s.cinturaActual;
  const genero = s.genero || 'hombre';

  // Recalculate everything
  const pctGrasaActual = calcGrasa7(pliegues, edad, genero);
  const masaMagra = pesoAyunas * (1 - pctGrasaActual / 100);
  const masaMagraProyectada = masaMagra + ganMus;
  const pesoTarget = masaMagraProyectada / (1 - pctTarget / 100);
  const grasaActualKg = pesoAyunas * (pctGrasaActual / 100);
  const grasaTargetKg = pesoTarget * (pctTarget / 100);
  const grasaEliminar = grasaActualKg - grasaTargetKg;
  const perdidaSemanal = getPerdidaSemanal(pctGrasaActual);
  const semanas = Math.ceil(grasaEliminar / perdidaSemanal);
  const deficitDiario = Math.round(perdidaSemanal * 7700 / 7);

  const indexedPliegues = pliegues.map((v,i) => ({ i, v, nombre: PLIEGUES_NAMES[i] }));
  indexedPliegues.sort((a,b) => b.v - a.v);
  const top3 = indexedPliegues.slice(0,3);
  const plieguTargets = calcPlieguTargets(pliegues, pctGrasaActual, pctTarget);
  const topPliegues = top3.map(p => ({ nombre: p.nombre, actual: p.v, target: plieguTargets[p.i], idx: p.i }));

  // Regenerate calendar
  const calendario = [];
  const [sy, sm, sd] = fecha.split('-').map(Number);
  const startDate = new Date(sy, sm-1, sd);
  const mesesFmt = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  const fmt = d => `${d.getDate()} ${mesesFmt[d.getMonth()]}`;
  let pNoche = pesoNoche;
  let pAyunas = pesoAyunas;
  for (let i = 1; i <= semanas; i++) {
    const ws = new Date(startDate); ws.setDate(startDate.getDate() + (i-1)*7);
    const we = new Date(ws); we.setDate(ws.getDate() + 6);
    pNoche = Math.round((pNoche - perdidaSemanal) * 10) / 10;
    pAyunas = Math.round((pAyunas - perdidaSemanal) * 10) / 10;
    calendario.push({ semana: i, fechaStr: `${fmt(ws)} – ${fmt(we)}`, targetNoche: pNoche, targetAyunas: pAyunas });
  }

  datos.setup = {
    pesoNoche, pesoAyunas, pctTarget, ganMus, cals, edad,
    fechaInicio: fecha, pctGrasaActual, masaMagra, pesoTarget,
    grasaEliminar, perdidaSemanal, semanas, deficitDiario,
    topPliegues, cinturaActual: cintura, plieguesIniciales: pliegues,
    plieguTargets, calendario
  };

  saveCutDatos(datos);
  closeEditModal();
  showToast("Datos actualizados ✓", "ok");
  renderProfile(document.getElementById('mainContent'));
}

// ── ACTIVIDAD VIEW ──
function getActividadDatos() {
  try { return JSON.parse(localStorage.getItem(uk("actividad-datos")) || "{}"); }
  catch(e) { return {}; }
}

function saveActividadDatos(d) {
  localStorage.setItem(uk("actividad-datos"), JSON.stringify(d));
  queueSync();
}

function guardarObjetivoPasos(valor) {
  const d = getActividadDatos();
  const n = parseInt(valor);
  if (!isNaN(n) && n > 0) d.objetivoPasos = n;
  else delete d.objetivoPasos;
  saveActividadDatos(d);
  renderActividad(document.getElementById("mainContent"));
}

function guardarActividad(fecha, campo, valor) {
  const d = getActividadDatos();
  if (!d.registros) d.registros = {};
  if (!d.registros[fecha]) d.registros[fecha] = {};
  if (campo === "pasos") {
    const n = parseInt(valor);
    if (!isNaN(n) && n >= 0) d.registros[fecha].pasos = n;
    else delete d.registros[fecha].pasos;
  } else if (campo === "cardio") {
    if (valor) { d.registros[fecha].cardio = true; }
    else { delete d.registros[fecha].cardio; delete d.registros[fecha].minCardio; delete d.registros[fecha].tipoCardio; }
  } else if (campo === "minCardio") {
    const n = parseInt(valor);
    if (!isNaN(n) && n > 0) d.registros[fecha].minCardio = n;
    else delete d.registros[fecha].minCardio;
  } else if (campo === "tipoCardio") {
    if (valor) d.registros[fecha].tipoCardio = valor;
    else delete d.registros[fecha].tipoCardio;
  }
  if (!d.registros[fecha].pasos && !d.registros[fecha].cardio && !d.registros[fecha].comidas?.length) delete d.registros[fecha];
  saveActividadDatos(d);
  renderActividad(document.getElementById("mainContent"));
}

function getActividadColor(reg, objetivo, isDark) {
  if (!reg || (!reg.pasos && !reg.cardio)) return isDark ? '#2a2a2a' : '#E5E5E3';
  const cumple = reg.pasos >= objetivo;
  const cardio = !!reg.cardio;
  if (cumple && cardio)  return isDark ? '#3ddc84' : '#2E7D32';
  if (cumple || cardio)  return '#81C784';
  return '#F9A825';
}

function renderActividad(main) {
  const d = getActividadDatos();
  const isDark = document.body.classList.contains('dark');
  const now = new Date();
  const hoy = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  const regHoy = d.registros?.[hoy] || {};
  const objetivo = d.objetivoPasos || 0;
  const TIPOS_CARDIO = ['Caminata', 'Trote / Carrera', 'HIIT', 'Bici', 'Natación', 'Elíptica', 'Otro'];

  let html = '<div style="padding:16px;max-width:600px;margin:0 auto">';

  // ── Registro de hoy ──
  html += '<div class="rehab-card">';
  html += '<div class="rehab-title" style="margin-bottom:12px">Actividad</div>';

  // Objetivo de pasos
  html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">';
  html += '<div style="font-size:12px;font-family:var(--font-mono);color:var(--muted);white-space:nowrap">Objetivo pasos:</div>';
  html += '<input class="cut-input" type="number" id="act-obj-input" value="' + (objetivo || "") + '" placeholder="p.ej. 8000" style="flex:1;padding:7px 8px;text-align:center">';
  html += '<button onclick="guardarObjetivoPasos(document.getElementById(\'act-obj-input\').value)" style="padding:7px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--font-mono);font-size:13px;white-space:nowrap">Guardar</button>';
  html += '</div>';

  if (objetivo > 0) {
    const pasosHoy = regHoy.pasos || 0;
    const pct = Math.min(1, pasosHoy > 0 ? pasosHoy / objetivo : 0);
    const cumple = pasosHoy >= objetivo;
    const circ = (2 * Math.PI * 36).toFixed(2);
    const dash = (pct * parseFloat(circ)).toFixed(2);
    const strokeColor = cumple ? 'var(--ok)' : 'var(--accent)';
    const stepLabel = pasosHoy >= 10000 ? (pasosHoy / 1000).toFixed(1) + 'k' : (pasosHoy || 0).toLocaleString();
    const pctLabel = pasosHoy ? Math.min(100, Math.round(pct * 100)) + '%' : (objetivo >= 1000 ? (objetivo / 1000).toFixed(0) + 'k meta' : objetivo + ' meta');

    const donutSvg = '<svg width="90" height="90" viewBox="0 0 90 90" style="flex-shrink:0">'
      + '<circle cx="45" cy="45" r="36" fill="none" style="stroke:var(--border)" stroke-width="8"/>'
      + (pct > 0 ? '<circle cx="45" cy="45" r="36" fill="none" style="stroke:' + strokeColor + '" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + dash + ' ' + circ + '" transform="rotate(-90 45 45)"/>' : '')
      + '<text x="45" y="43" text-anchor="middle" style="fill:var(--text);font-family:monospace;font-size:14px;font-weight:700">' + (pasosHoy ? stepLabel : '—') + '</text>'
      + '<text x="45" y="57" text-anchor="middle" style="fill:' + (cumple ? 'var(--ok)' : 'var(--muted)') + ';font-family:monospace;font-size:10px">' + pctLabel + '</text>'
      + '</svg>';

    // Donut + pasos input
    html += '<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px">';
    html += donutSvg;
    html += '<div style="flex:1">';
    html += '<div style="font-size:12px;font-family:var(--font-mono);color:var(--muted);margin-bottom:6px">Pasos hoy</div>';
    html += '<input class="cut-input" type="number" id="act-pasos-hoy" value="' + (regHoy.pasos || "") + '" placeholder="0" style="width:100%;padding:8px;text-align:center" onchange="guardarActividad(\'' + hoy + '\',\'pasos\',this.value)">';
    html += '<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-top:4px">Objetivo: ' + objetivo.toLocaleString() + '</div>';
    html += '</div></div>';

    // Cardio
    html += '<label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;margin-bottom:' + (regHoy.cardio ? '8px' : '0') + '">';
    html += '<input type="checkbox" ' + (regHoy.cardio ? 'checked' : '') + ' onchange="guardarActividad(\'' + hoy + '\',\'cardio\',this.checked)" style="width:16px;height:16px;cursor:pointer">';
    html += '<span>Cardio hoy</span></label>';
    if (regHoy.cardio) {
      let tipoOpts = '<option value="">Tipo...</option>';
      TIPOS_CARDIO.forEach(function(t) { tipoOpts += '<option value="' + t + '"' + (regHoy.tipoCardio === t ? ' selected' : '') + '>' + t + '</option>'; });
      html += '<div style="display:flex;gap:8px;align-items:center">';
      html += '<input class="cut-input" type="number" value="' + (regHoy.minCardio || "") + '" placeholder="min" style="width:70px;padding:6px 8px;text-align:center" onchange="guardarActividad(\'' + hoy + '\',\'minCardio\',this.value)">';
      html += '<span style="font-size:12px;color:var(--muted);font-family:var(--font-mono)">min</span>';
      html += '<select class="cut-input" style="flex:1;padding:6px 8px" onchange="guardarActividad(\'' + hoy + '\',\'tipoCardio\',this.value)">' + tipoOpts + '</select>';
      html += '</div>';
    }
  } else {
    html += '<div style="font-size:13px;color:var(--muted)">Define el objetivo de pasos arriba para empezar a registrar.</div>';
  }

  html += '</div>';

  // ── Heatmap — solo desde el primer registro, hoy en la ultima fila ──
  const registros = d.registros || {};
  const fechasRegistradas = Object.keys(registros).sort();
  if (objetivo > 0 && fechasRegistradas.length > 0) {
    const todayMid = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const thisMonday = new Date(todayMid.getTime() - ((todayMid.getDay() + 6) % 7) * 86400000);
    const fp = fechasRegistradas[0].split('-');
    const firstDate = new Date(parseInt(fp[0]), parseInt(fp[1]) - 1, parseInt(fp[2]));
    const firstDow = (firstDate.getDay() + 6) % 7;
    const hmStart = new Date(firstDate.getTime() - firstDow * 86400000);
    const numWeeks = Math.max(1, Math.round((thisMonday.getTime() - hmStart.getTime()) / (7 * 86400000)) + 1);

    html += '<div class="rehab-card"><div class="rehab-title" style="margin-bottom:10px">Historial</div>';
    html += '<div class="rehab-heatmap-grid">';
    ['L','M','X','J','V','S','D'].forEach(function(lb) { html += '<div class="rehab-heatmap-dow">' + lb + '</div>'; });

    for (let row = 0; row < numWeeks; row++) {
      for (let col = 0; col < 7; col++) {
        const cellDate = new Date(hmStart.getTime() + (row * 7 + col) * 86400000);
        const cellStr = cellDate.getFullYear() + '-' + String(cellDate.getMonth()+1).padStart(2,'0') + '-' + String(cellDate.getDate()).padStart(2,'0');
        const isFuture = cellDate > todayMid;
        const isToday = cellStr === hoy;
        const reg = registros[cellStr];
        const color = isFuture ? (isDark ? '#1e1e1e' : '#F0F0F0') : getActividadColor(reg, objetivo, isDark);
        const outline = isToday ? 'outline:2px solid var(--accent);outline-offset:1px;' : '';
        const opacity = isFuture ? 'opacity:0.25;cursor:default;' : '';
        const onclick = isFuture ? '' : ' onclick="showActividadHeatmapDay(\'' + cellStr + '\')"';
        html += '<div class="rehab-heatmap-cell"' + onclick + ' style="background:' + color + ';' + outline + opacity + '"></div>';
      }
    }

    html += '</div>';
    html += '<div style="display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--muted);font-family:var(--font-mono);flex-wrap:wrap">'
      + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#2E7D32;vertical-align:middle;margin-right:3px"></span>pasos+cardio</span>'
      + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#81C784;vertical-align:middle;margin-right:3px"></span>uno de dos</span>'
      + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#F9A825;vertical-align:middle;margin-right:3px"></span>por debajo</span>'
      + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#E5E5E3;vertical-align:middle;margin-right:3px"></span>sin dato</span>'
      + '</div>';
    html += '<div id="act-heatmap-tooltip" style="display:none" class="rehab-heatmap-tooltip"></div>';
    html += '</div>';
  }

  html += '</div>';

  // ── Calorías de hoy ──
  const lib = getFoodLibrary();
  const comidas = regHoy.comidas || [];
  const totales = calcDayTotals(comidas);
  const cutSetup = getCutDatos().setup;
  const kcalTarget = cutSetup ? cutSetup.cals : 0;

  html += '<div class="rehab-card">';
  html += '<div class="rehab-title" style="margin-bottom:12px">Calorías</div>';

  if (comidas.length > 0) {
    // Totales macro row
    html += '<div style="display:flex;gap:8px;text-align:center;margin-bottom:12px">';
    html += '<div style="flex:1"><div style="font-family:var(--font-mono);font-size:20px;font-weight:700">' + totales.kcal + '</div><div style="font-size:10px;color:var(--muted)">kcal</div></div>';
    html += '<div style="flex:1"><div style="font-family:var(--font-mono);font-size:20px;font-weight:700">' + Math.round(totales.prot) + 'g</div><div style="font-size:10px;color:var(--muted)">prot</div></div>';
    html += '<div style="flex:1"><div style="font-family:var(--font-mono);font-size:20px;font-weight:700">' + Math.round(totales.carbs) + 'g</div><div style="font-size:10px;color:var(--muted)">carbs</div></div>';
    html += '<div style="flex:1"><div style="font-family:var(--font-mono);font-size:20px;font-weight:700">' + Math.round(totales.grasas) + 'g</div><div style="font-size:10px;color:var(--muted)">grasas</div></div>';
    html += '</div>';
    if (kcalTarget > 0) {
      const pct = Math.min(1, totales.kcal / kcalTarget);
      const barColor = totales.kcal > kcalTarget * 1.05 ? 'var(--warn)' : 'var(--ok)';
      html += '<div style="background:var(--border);border-radius:4px;height:6px;margin-bottom:10px">';
      html += '<div style="background:' + barColor + ';height:6px;border-radius:4px;width:' + Math.round(pct*100) + '%"></div></div>';
      html += '<div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-bottom:10px;text-align:right">' + totales.kcal + ' / ' + kcalTarget + ' kcal objetivo</div>';
    }
    // List of today's foods
    comidas.forEach(function(c, i) {
      html += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border)">';
      html += '<div style="flex:1"><div style="font-size:13px">' + c.nombre + '</div>';
      html += '<div style="font-size:11px;font-family:var(--font-mono);color:var(--muted)">' + c.gramos + 'g &nbsp;· ' + c.kcal + ' kcal &nbsp;P:' + c.prot + 'g C:' + c.carbs + 'g G:' + c.grasas + 'g</div></div>';
      html += '<button onclick="removeLogEntry(\'' + hoy + '\',' + i + ')" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px">&#xD7;</button>';
      html += '</div>';
    });
  } else {
    html += '<div style="font-size:12px;color:var(--muted);margin-bottom:10px">Sin registro de calorías hoy.</div>';
  }

  // Add food button / inline form
  if (lib.length === 0) {
    html += '<div style="font-size:12px;color:var(--muted);border:1px dashed var(--border);border-radius:var(--radius);padding:10px;text-align:center">Agrega alimentos a tu biblioteca para empezar a registrar.</div>';
  } else {
    html += '<button onclick="toggleAddFoodPanel()" style="width:100%;margin-top:8px;padding:9px;background:var(--surface-2,#f0f0f0);border:1px dashed var(--border);border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--accent);font-family:var(--font-mono)">+ Agregar alimento</button>';
    html += '<div id="add-food-panel" style="display:none;margin-top:8px">';
    html += '<select id="food-select" class="cut-input" style="width:100%;padding:7px 8px;margin-bottom:6px"><option value="">Seleccionar alimento...</option>';
    lib.forEach(function(f) {
      html += '<option value="' + f.id + '">' + f.nombre + ' (' + f.kcal + ' kcal/100g)</option>';
    });
    html += '</select>';
    html += '<div style="display:flex;gap:6px">';
    html += '<input id="food-gramos" class="cut-input" type="number" placeholder="gramos" style="flex:1;padding:7px 8px;text-align:center">';
    html += '<button onclick="logFoodEntryFromUI(\'' + hoy + '\')" style="padding:7px 16px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;font-family:var(--font-mono);font-size:13px;white-space:nowrap">OK</button>';
    html += '</div></div>';
  }
  html += '</div>';

  // ── TDEE Estimado ──
  const tdeeData = estimateTDEE();
  if (tdeeData.length >= 2) {
    const avgTDEE = Math.round(tdeeData.reduce(function(a,w){return a+w.tdee;},0) / tdeeData.length);
    html += '<div class="rehab-card">';
    html += '<div class="rehab-title" style="margin-bottom:8px">Gasto estimado real</div>';
    html += '<div style="font-family:var(--font-mono);font-size:24px;font-weight:700;text-align:center;color:var(--text)">' + avgTDEE.toLocaleString() + ' kcal</div>';
    html += '<div style="font-size:11px;color:var(--muted);text-align:center;margin-bottom:14px">promedio de ' + tdeeData.length + ' semanas · consumo vs cambio real de peso</div>';
    html += '<table style="width:100%;border-collapse:collapse;font-size:11px;font-family:var(--font-mono)">';

function addFoodToLibrary(nombre, kcal, prot, carbs, grasas) {

function deleteFoodFromLibrary(id) {

function logFoodEntry(fecha, foodId, gramos) {
  const lib = getFoodLibrary();
  const food = lib.find(function(f) { return f.id === foodId; });
  if (!food || !gramos) return;
  const g = parseFloat(gramos);
  if (isNaN(g) || g <= 0) return;
  const factor = g / 100;
  const entry = {
    foodId: foodId, nombre: food.nombre, gramos: g,
    kcal: Math.round(food.kcal * factor),
    prot: Math.round(food.prot * factor * 10) / 10,
    carbs: Math.round(food.carbs * factor * 10) / 10,
    grasas: Math.round(food.grasas * factor * 10) / 10,
  };
  const d = getActividadDatos();
  if (!d.registros) d.registros = {};
  if (!d.registros[fecha]) d.registros[fecha] = {};
  if (!d.registros[fecha].comidas) d.registros[fecha].comidas = [];
  d.registros[fecha].comidas.push(entry);
  saveActividadDatos(d);
  renderActividad(document.getElementById('mainContent'));
}
function removeLogEntry(fecha, idx) {
  const d = getActividadDatos();
  if (!d.registros || !d.registros[fecha] || !d.registros[fecha].comidas) return;
  d.registros[fecha].comidas.splice(idx, 1);
  if (!d.registros[fecha].comidas.length) delete d.registros[fecha].comidas;
  if (!d.registros[fecha].pasos && !d.registros[fecha].cardio && !d.registros[fecha].comidas) delete d.registros[fecha];
  saveActividadDatos(d);
  renderActividad(document.getElementById('mainContent'));
}
function calcDayTotals(comidas) {
  return (comidas || []).reduce(function(acc, c) {
    return { kcal: acc.kcal+(c.kcal||0), prot: acc.prot+(c.prot||0), carbs: acc.carbs+(c.carbs||0), grasas: acc.grasas+(c.grasas||0) };
  }, { kcal: 0, prot: 0, carbs: 0, grasas: 0 });
}

function estimateTDEE() {
  const actDatos = getActividadDatos();
  const cutDatos = getCutDatos();
  if (!cutDatos.setup) return [];
  const registros = actDatos.registros || {};
  const pesosDiarios = cutDatos.registrosDiarios || {};
  const pesoFechas = Object.keys(pesosDiarios).sort().filter(function(f) {
    return pesosDiarios[f] && (pesosDiarios[f].ayunas || pesosDiarios[f].noche);
  });
  if (pesoFechas.length < 2) return [];

  // Group calorie data by ISO week (Monday)
  const weekMap = {};
  Object.keys(registros).forEach(function(fecha) {
    const reg = registros[fecha];
    if (!reg.comidas || !reg.comidas.length) return;
    const parts = fecha.split('-').map(Number);
    const dt = new Date(parts[0], parts[1]-1, parts[2]);
    const dow = (dt.getDay() + 6) % 7;
    const mon = new Date(dt.getTime() - dow * 86400000);
    const wk = mon.getFullYear() + '-' + String(mon.getMonth()+1).padStart(2,'0') + '-' + String(mon.getDate()).padStart(2,'0');
    if (!weekMap[wk]) weekMap[wk] = [];
    weekMap[wk].push(calcDayTotals(reg.comidas).kcal);
  });

  const results = [];
  Object.keys(weekMap).sort().forEach(function(wkMon) {
    const kcals = weekMap[wkMon];
    if (kcals.length < 3) return;
    const avgKcal = Math.round(kcals.reduce(function(a,b){return a+b;},0) / kcals.length);
    const p = wkMon.split('-').map(Number);
    const sunDt = new Date(p[0], p[1]-1, p[2]+6);
    const wkSun = sunDt.getFullYear() + '-' + String(sunDt.getMonth()+1).padStart(2,'0') + '-' + String(sunDt.getDate()).padStart(2,'0');
    // Last peso before week start, last peso through week end
    const atStart = pesoFechas.filter(function(f){ return f < wkMon; });
    const throughEnd = pesoFechas.filter(function(f){ return f <= wkSun; });
    if (!atStart.length || !throughEnd.length) return;
    const startFecha = atStart[atStart.length-1];
    const endFecha = throughEnd[throughEnd.length-1];
    if (startFecha === endFecha) return;
    const sp = startFecha.split('-').map(Number);
    const ep = endFecha.split('-').map(Number);
    const days = Math.round((new Date(ep[0],ep[1]-1,ep[2]) - new Date(sp[0],sp[1]-1,sp[2])) / 86400000);
    if (days < 3) return;
    const pesoStart = pesosDiarios[startFecha].ayunas || pesosDiarios[startFecha].noche;
    const pesoEnd = pesosDiarios[endFecha].ayunas || pesosDiarios[endFecha].noche;
    if (!pesoStart || !pesoEnd) return;
    const deltaPerDay = (pesoEnd - pesoStart) / days;
    const tdee = Math.round(avgKcal - deltaPerDay * 7700);
    if (tdee < 1000 || tdee > 6000) return;
    results.push({ semana: wkMon, avgKcal: avgKcal, deltaPeso: Math.round((pesoEnd-pesoStart)*100)/100, dias: kcals.length, tdee: tdee });
  });
  return results;
}

function habDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function habWeekMonday(dateStr) {
  const p = dateStr.split('-');
  const d = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2]));
  const dow = (d.getDay()+6)%7;
  const mon = new Date(d.getTime() - dow*86400000);
  return habDateStr(mon);

function calcHabitosPct(habitos, regDia) {
  if (!habitos || !habitos.length) return null;
  let completados = 0;
  habitos.forEach(function(h) {
    const r = (regDia || {})[h.id] || {};
    if (r.completado) completados++;
  });
  return Math.round(completados / habitos.length * 100);
}
function getHabitosColor(pct, isDark) {
  if (pct === null || pct === undefined) return isDark ? '#2a2a2a' : '#E5E5E3';
  if (pct <= 0) return isDark ? '#2a2a2a' : '#E5E5E3';
  if (pct >= 100) return isDark ? '#66bb6a' : '#2E7D32';
  if (pct >= 50)  return '#81C784';
  return '#F9A825';
}
function mostrarMensajeHabitos(hoy, pct) {
  const umbrales = [100, 80, 50];
  const prevUmbral = _habitosMsgUmbral[hoy] || 0;
  for (let ui = 0; ui < umbrales.length; ui++) {
    const u = umbrales[ui];
    if (pct >= u && prevUmbral < u) {
      const msgs = MENSAJES_HABITOS[u];
      const msg = msgs[Math.floor(Math.random() * msgs.length)];
      showToast(msg, 'ok');
      _habitosMsgUmbral[hoy] = u;
      return;
    }
  }
}

function guardarValorHabito(fecha, habitoId, valor) {
  const d = getHabitosDatos();

  const hab = (d.habitos || []).find(function(h) { return h.id === habitoId; });

  if (!isNaN(n) && n >= 0) {

    delete d.registros[fecha][habitoId];

function renderHabitos(main) {
  const d = getHabitosDatos();
  const isDark = document.body.classList.contains('dark');
  const now = new Date();
  const hoy = habDateStr(now);
  const habitos = d.habitos || [];
  const registros = d.registros || {};
  const regHoy = registros[hoy] || {};

  let html = '<div style="padding:16px;max-width:600px;margin:0 auto">';

  // Resumen semanal
  const todayMidR = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const lastMondayR = new Date(todayMidR.getTime() - ((todayMidR.getDay()+6)%7)*86400000);
  const prevMondayR = new Date(lastMondayR.getTime() - 7*86400000);
  const prevSundayR = new Date(lastMondayR.getTime() - 86400000);
  const weekKey = 'w-' + habDateStr(prevMondayR);
  const resumenVisto = (d.resumenVisto || {})[weekKey];

  if (!resumenVisto && habitos.length > 0) {
    const prevDays = [];
    for (let i = 0; i < 7; i++) {
      prevDays.push(habDateStr(new Date(prevMondayR.getTime() + i*86400000)));
    }
    const daysConReg = prevDays.filter(function(f) { return registros[f] && Object.keys(registros[f]).length > 0; });

      const pcts = prevDays.map(function(f) { return calcHabitosPct(habitos, registros[f] || {}); });
      const pctsFilt = pcts.filter(function(p) { return p !== null; });
      const avgPct = pctsFilt.length ? Math.round(pctsFilt.reduce(function(a,b){return a+b;},0)/pctsFilt.length) : 0;
      let mejorH = null, mejorP = -1, peorH = null, peorP = 101;
      habitos.forEach(function(h) {

  // Heatmap

      html += '<div class="rehab-card">';
      html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';
      html += '<div class="rehab-title" style="margin-bottom:0;flex:1">Curva de crecimiento</div>';

          opts += '<option value="' + h.id + '"' + (_habitosFiltroId===h.id?' selected':'') + '>' + h.nombre + '</option>';
        });
        html += '<select class="cut-input" style="padding:4px 6px;font-size:12px" onchange="cambiarFiltroHabitos(this.value)">' + opts + '</select>';

      html += '</div>';
      html += '<div style="overflow-x:auto">' + svgStr + '</div>';

  }

  html += '</div>';
  main.innerHTML = html;

// ── TIMER ──
const _timer = { active: false, paused: false, endTs: 0, pausedMs: 0, duration: 0, label: '', _iv: null, beepFired: false };
var _wakeLock = null;
// Genera WAV — 3 pings ascendentes con envelope tipo campana, 4 repeticiones
function _makeBeepSequenceWav() {
  var sr = 22050;
  var freqs   = [1047, 1319, 1568]; // C6, E6, G6
  var noteDur = 0.18;               // duracion de cada ping
  var noteGap = 0.07;               // silencio entre pings del grupo
  var groupGap = 0.72;              // pausa entre grupos
  var reps = 4;
  var groupDur = freqs.length * (noteDur + noteGap);
  var totalDur = reps * (groupDur + groupGap);
  var n = Math.floor(sr * totalDur);
  var ab = new ArrayBuffer(44 + n * 2);
  var v = new DataView(ab);
  var ws = function(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true);
  ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, n * 2, true);
  for (var i = 0; i < n; i++) {
    var t = i / sr, sample = 0;
    for (var r = 0; r < reps; r++) {
      var tRep = t - r * (groupDur + groupGap);
      if (tRep < 0 || tRep >= groupDur) continue;
      for (var ni = 0; ni < freqs.length; ni++) {
        var tNote = tRep - ni * (noteDur + noteGap);
        if (tNote < 0 || tNote >= noteDur) continue;
        // ataque rapido (8ms), decay exponencial — suena como campana/ping
        var env = tNote < 0.008 ? tNote / 0.008 : Math.exp(-9 * (tNote - 0.008));
        sample = Math.sin(2 * Math.PI * freqs[ni] * tNote) * env * 0x5FFF;
      }
    }
    v.setInt16(44 + i * 2, Math.round(Math.max(-0x7FFF, Math.min(0x7FFF, sample))), true);
  }
  var u8 = new Uint8Array(ab), s = '';
  for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return 'data:audio/wav;base64,' + btoa(s);
}

// Pre-generar al cargar
var _beepAudio = (function() {
  try {
    var a = new Audio(_makeBeepSequenceWav());
    a.preload = 'auto';
    a.load();
    return a;
  } catch(e) { return null; }
})();

// Audio mudo en loop: mantiene la sesion de audio activa en iOS
// para que play() funcione desde setInterval cuando el timer termina
function _makeSilentWav() {
  var sr = 22050, n = sr; // 1 segundo de silencio
  var ab = new ArrayBuffer(44 + n * 2);
  var v = new DataView(ab);
  var ws = function(o, s) { for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true);
  ws(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  ws(36, 'data'); v.setUint32(40, n * 2, true);
  var u8 = new Uint8Array(ab), s = '';
  for (var i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return 'data:audio/wav;base64,' + btoa(s);
}
var _keepAlive = (function() {
  try {
    var a = new Audio(_makeSilentWav());
    a.loop = true;
    a.volume = 0;
    return a;
  } catch(e) { return null; }
})();

function _unlockAudio() {
  if (_keepAlive) _keepAlive.play().catch(function() {});
  if (_beepAudio) { _beepAudio.play().then(function() { _beepAudio.pause(); _beepAudio.currentTime = 0; }).catch(function() {}); }
}

document.addEventListener('touchstart', _unlockAudio, { passive: true, once: true });
document.addEventListener('click',      _unlockAudio, { passive: true, once: true });

function getTimerConfig() {
  const saved = localStorage.getItem(uk('timer-config'));
  const defaults = { tiempoFuerza: 180, tiempoAccesorio: 120 };
  return saved ? Object.assign({}, defaults, JSON.parse(saved)) : defaults;
}
function saveTimerConfig(d) {
  localStorage.setItem(uk('timer-config'), JSON.stringify(d));
}
function saveTimerConfigField(field, value) {
  const cfg = getTimerConfig();
  cfg[field] = value;
  saveTimerConfig(cfg);
  const main = document.getElementById('mainContent');
  if (state.view === 'config') renderConfig(main);
}

function formatTimer(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function playTimerBeep() {
  if (!_beepAudio) return;
  try {
    _beepAudio.currentTime = 0;
    _beepAudio.play().catch(function() {});
  } catch(e) {}
}

function updateTimerBar() {
  const bar = document.getElementById('timerBar');
  const countEl = document.getElementById('timerCount');
  if (!bar || !countEl) return;
  if (!_timer.active) { bar.classList.remove('visible', 'done', 'urgent'); return; }

  let remaining;
  if (_timer.paused) {
    remaining = _timer.pausedMs;
  } else {
    remaining = _timer.endTs - Date.now();
  }

  if (remaining <= 0 && !_timer.paused) {
    countEl.textContent = '0:00';
    bar.classList.remove('urgent');
    bar.classList.add('done');
    if (!_timer.beepFired) {
      _timer.beepFired = true;
      playTimerBeep();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
    clearInterval(_timer._iv);
    _timer._iv = null;
    // Ocultar al terminar el audio; si no hay audio, fallback 4s
    if (_beepAudio) {
      _beepAudio.onended = function() { _beepAudio.onended = null; cancelTimer(); };
    } else {
      setTimeout(cancelTimer, 4000);
    }
    return;
  }

  countEl.textContent = _timer.paused ? formatTimer(remaining) + ' ⏸' : formatTimer(remaining);

  if (!_timer.paused && remaining < 10000) {
    bar.classList.add('urgent');
    bar.classList.remove('done');
  } else {
    bar.classList.remove('urgent', 'done');
  }
}

function _acquireWakeLock() {
  if (!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(wl) {
    _wakeLock = wl;
    _wakeLock.addEventListener('release', function() { _wakeLock = null; });
  }).catch(function() {});
}
function _releaseWakeLock() {
  if (_wakeLock) { try { _wakeLock.release(); } catch(e) {} _wakeLock = null; }
}

function startTimer(duracionSeg, label) {
  if (_timer._iv) clearInterval(_timer._iv);
  _timer.active = true;
  _timer.paused = false;
  _timer.beepFired = false;
  _timer.duration = duracionSeg * 1000;
  _timer.endTs = Date.now() + _timer.duration;
  _timer.pausedMs = 0;
  _timer.label = label || 'Descanso';
  const bar = document.getElementById('timerBar');
  const labelEl = document.getElementById('timerLabel');
  if (bar) bar.classList.add('visible');
  if (labelEl) labelEl.textContent = _timer.label;
  // Mantener sesion de audio activa en iOS durante el timer
  if (_keepAlive) _keepAlive.play().catch(function() {});
  _acquireWakeLock();
  updateTimerBar();
  _timer._iv = setInterval(updateTimerBar, 200);
}

function startTimerForKey(key) {
  const cfg = getTimerConfig();
  const parts = key.split('-');
  const mesoKey = parts[0];
  const meso = MESOCICLOS[mesoKey];
  if (!meso) { startTimer(cfg.tiempoFuerza, 'Descanso'); return; }
  const diaKey = parts[3];
  const ejNombre = parts.slice(4, parts.length - 1).join('-');
  const plan = meso.plan && meso.plan[diaKey] ? meso.plan[diaKey] : [];
  const ej = plan.find(e => e.nombre === ejNombre);
  const rol = ej ? ej.rol : null;
  const duracion = (rol === 'accesorio') ? cfg.tiempoAccesorio : cfg.tiempoFuerza;
  const label = ej ? ej.nombre : 'Descanso';
  startTimer(duracion, label);
}

function pauseResumeTimer() {
  if (!_timer.active) return;
  if (_timer.paused) {
    _timer.endTs = Date.now() + _timer.pausedMs;
    _timer.paused = false;
    if (!_timer._iv) _timer._iv = setInterval(updateTimerBar, 200);
  } else {
    _timer.pausedMs = _timer.endTs - Date.now();
    _timer.paused = true;
  }
  updateTimerBar();
}

function adjustTimer(deltaSeg) {
  if (!_timer.active) return;
  const deltaMs = deltaSeg * 1000;
  if (_timer.paused) {
    _timer.pausedMs = Math.max(1000, _timer.pausedMs + deltaMs);
  } else {
    _timer.endTs = Math.max(Date.now() + 1000, _timer.endTs + deltaMs);
  }
  updateTimerBar();
}

function cancelTimer() {
  if (_timer._iv) clearInterval(_timer._iv);
  _timer.active = false;
  _timer.paused = false;
  _timer._iv = null;
  if (_keepAlive) { _keepAlive.pause(); _keepAlive.currentTime = 0; }
  _releaseWakeLock();
  const bar = document.getElementById('timerBar');
  if (bar) bar.classList.remove('visible', 'done', 'urgent');
}

// Al volver a la app desde background: restaurar audio y disparar alarma si el timer ya expiró
document.addEventListener('visibilitychange', function() {
  if (document.visibilityState !== 'visible' || !_timer.active || _timer.paused) return;
  // Re-establecer sesión de audio (iOS la suspende en background)
  if (_keepAlive) _keepAlive.play().catch(function() {});
  var remaining = _timer.endTs - Date.now();
  if (remaining <= 0) {
    // Timer expiró mientras estábamos en background
    var bar = document.getElementById('timerBar');
    var countEl = document.getElementById('timerCount');
    if (bar) { bar.classList.remove('urgent'); bar.classList.add('done'); }
    if (countEl) countEl.textContent = '0:00';
    if (!_timer.beepFired) {
      _timer.beepFired = true;
      playTimerBeep();
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
    if (_beepAudio) {
      _beepAudio.onended = function() { _beepAudio.onended = null; cancelTimer(); };
    } else {
      setTimeout(cancelTimer, 4000);
    }
  } else {
    // Timer aún activo — re-adquirir wake lock (OS lo libera en background)
    _acquireWakeLock();
    if (!_timer._iv) _timer._iv = setInterval(updateTimerBar, 200);
  }
});

let syncTimer = null;
let syncPending = false;

function queueSync() {
  syncPending = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(pushToGithub, 3000);
}

async function getGithubFileSha(filename) {
  try {
    const r = await fetch(
      `https://api.github.com/repos/${state.githubRepo}/contents/${filename}`,
      { headers: { Authorization: `token ${state.githubToken}` } }
    );
    if (!r.ok) return null;
    const d = await r.json();
    return d.sha;
  } catch(e) { return null; }
}

async function pushToGithub() {
  if (!state.githubToken) return;
  try {
    const payload = {
      registros: state.registros,
      rehab: JSON.parse(localStorage.getItem(uk("rehab-datos")) || "{}"),
      cut: JSON.parse(localStorage.getItem(uk("cut-datos")) || "{}"),
      test: JSON.parse(localStorage.getItem(uk("test-datos")) || "{}"),
      actividad: JSON.parse(localStorage.getItem(uk("actividad-datos")) || "{}"),
      habitos: JSON.parse(localStorage.getItem(uk("habitos-datos")) || "{}"),
      userProfile: JSON.parse(localStorage.getItem(uk("user-profile")) || "{}"),
      foodLibrary: JSON.parse(localStorage.getItem(state.currentUser + "-food-library") || "[]"),
      timestamp: new Date().toISOString()
    };

    const dataFile = `data-${state.currentUser}.json`;
    const sha = await getGithubFileSha(dataFile);
    const body = {
      message: "Sync data " + new Date().toISOString().slice(0,16),
      content: btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2)))),
    };
    if (sha) body.sha = sha;

    const r = await fetch(
      `https://api.github.com/repos/${state.githubRepo}/contents/${dataFile}`,
      {
        method: "PUT",
        headers: {
          Authorization: `token ${state.githubToken}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify(body)
      }
    );

    if (r.ok) {
      syncPending = false;
      showToast("Datos subidos ✓", "ok");
    } else {
      throw new Error("GitHub API error: " + r.status);
    }
  } catch(e) {
    console.error("Push error:", e);
    showToast("Error al subir datos", "err");
  }
}

async function pullFromGithub() {
  if (!state.githubToken) return;
  try {
    let url = `https://raw.githubusercontent.com/${state.githubRepo}/main/data-${state.currentUser}.json?t=${Date.now()}`;
    let r = await fetch(url, { cache: "no-store" });
    if (!r.ok) {
      // Fallback a data.json solo para el usuario original (migración single→multi usuario).
      // Otros usuarios nunca deben heredar data.json o recibirán datos del usuario original.
      const originalUser = localStorage.getItem('forge-original-user');
      if (state.currentUser !== originalUser) {
        showToast("Sin datos remotos aún para " + state.currentUser, "ok"); return;
      }
      url = `https://raw.githubusercontent.com/${state.githubRepo}/main/data.json?t=${Date.now()}`;
      r = await fetch(url, { cache: "no-store" });
      if (!r.ok) { showToast("Sin datos remotos aún", "ok"); return; }
    }
    const data = await r.json();

    if (data.registros) {
      let merged = 0;
      Object.entries(data.registros).forEach(([key, val]) => {
        const localTs = state.registros[key]?.timestamp || "";
        const remoteTs = val?.timestamp || "";
        if (!state.registros[key] || remoteTs >= localTs) {
          state.registros[key] = val;
          merged++;
        }
      });
      saveLocal();
    }

    if (data.rehab && Object.keys(data.rehab).length > 0) {
      data.rehab._syncTs = data.timestamp;
      localStorage.setItem(uk("rehab-datos"), JSON.stringify(data.rehab));
    }

    if (data.cut && Object.keys(data.cut).length > 0) {
      // Si el pull de cut está bloqueado para este usuario (decontaminación activa),
      // no cargar — el archivo remoto puede tener datos de otro usuario.
      const _cutBlocked = localStorage.getItem('forge-cut-pull-blocked-' + state.currentUser);
      if (!_cutBlocked) {
        data.cut._syncTs = data.timestamp;
        const localCut = JSON.parse(localStorage.getItem(uk("cut-datos")) || "{}");
        const mergedCut = Object.assign({}, data.cut);
        ['registrosDiarios', 'registrosSemanales', 'registrosMensuales'].forEach(field => {
          mergedCut[field] = Object.assign({}, localCut[field] || {}, data.cut[field] || {});
        });
        if (!mergedCut.setup && localCut.setup) mergedCut.setup = localCut.setup;
        localStorage.setItem(uk("cut-datos"), JSON.stringify(mergedCut));
      }
    }

    if (data.test && Object.keys(data.test).length > 0) {
      localStorage.setItem(uk("test-datos"), JSON.stringify(data.test));
    }

    if (data.actividad && Object.keys(data.actividad).length > 0) {
      const localAct = JSON.parse(localStorage.getItem(uk("actividad-datos")) || "{}");
      const mergedAct = Object.assign({}, localAct, data.actividad);
      mergedAct.registros = Object.assign({}, localAct.registros || {}, data.actividad.registros || {});
      localStorage.setItem(uk("actividad-datos"), JSON.stringify(mergedAct));
    }

    if (data.habitos && Object.keys(data.habitos).length > 0) {
      const localHab = JSON.parse(localStorage.getItem(uk("habitos-datos")) || "{}");
      const mergedHab = Object.assign({}, localHab, data.habitos);
      mergedHab.habitos = data.habitos.habitos || localHab.habitos || [];
      mergedHab.registros = Object.assign({}, localHab.registros || {}, data.habitos.registros || {});
      mergedHab.resumenVisto = Object.assign({}, localHab.resumenVisto || {}, data.habitos.resumenVisto || {});
      localStorage.setItem(uk("habitos-datos"), JSON.stringify(mergedHab));
    }

    if (data.userProfile && Object.keys(data.userProfile).length > 0) {
      const localProfile = JSON.parse(localStorage.getItem(uk("user-profile")) || "{}");
      localStorage.setItem(uk("user-profile"), JSON.stringify(Object.assign({}, localProfile, data.userProfile)));
    }

    if (Array.isArray(data.foodLibrary) && data.foodLibrary.length > 0) {
      const localLib = JSON.parse(localStorage.getItem(state.currentUser + "-food-library") || "[]");
      const merged = Object.values(
        [...localLib, ...data.foodLibrary].reduce(function(acc, f) {
          if (!acc[f.id] || data.foodLibrary.find(function(r){ return r.id === f.id; })) acc[f.id] = f;
          return acc;
        }, {})
      );
      localStorage.setItem(state.currentUser + "-food-library", JSON.stringify(merged));
    }

    showToast("Datos descargados ✓", "ok");
    render();
    // Si estamos en rehab, cut, actividad o profile, re-renderizar esa vista también
    const main = document.getElementById("mainContent");
    if (state.view === "rehab") renderRehab(main);
    if (state.view === "cut") renderCut(main);
    if (state.view === "actividad") renderActividad(main);
    if (state.view === "habitos") renderHabitos(main);
    if (state.view === "profile") renderProfile(main);
  } catch(e) {
    console.error("Pull error:", e);
    showToast("Error: " + e.message, "err");
  }
}

// ── Auto-detección de posición por fecha ──
function detectPosition() {
  const userMesos = USUARIOS[state.currentUser]?.mesociclos || [];
  const today = new Date();
  const meses = {
    'ene':0,'feb':1,'mar':2,'abr':3,'may':4,'jun':5,
    'jul':6,'ago':7,'sep':8,'oct':9,'nov':10,'dic':11
  };

  function parseDate(s, fallbackMon) {
    s = s.trim();
    const parts = s.split(' ');
    const day = parseInt(parts[0]);
    const mon = parts[1] ? meses[parts[1].toLowerCase()] : fallbackMon;
    return new Date(2026, mon, day);
  }

  for (const [mesoKey, meso] of Object.entries(MESOCICLOS)) {
    if (!userMesos.includes(mesoKey)) continue;
    if (!meso.fechas) continue;
    for (let i = 0; i < meso.fechas.length; i++) {
      const rango = meso.fechas[i];
      const dashIdx = rango.indexOf('–');
      if (dashIdx === -1) continue;
      const startRaw = rango.slice(0, dashIdx).trim();
      const endRaw = rango.slice(dashIdx + 1).trim();

      // endRaw siempre tiene mes
      const endParts = endRaw.split(' ');
      const endMon = meses[endParts[1]?.toLowerCase()];
      const endDay = parseInt(endParts[0]);
      const endDate = new Date(2026, endMon, endDay);

      // startRaw puede o no tener mes
      const startParts = startRaw.split(' ');
      const startDay = parseInt(startParts[0]);
      const startMon = startParts[1] ? meses[startParts[1].toLowerCase()] : endMon;
      const startDate = new Date(2026, startMon, startDay);

      // Incluir hasta el domingo de esa semana
      const weekEnd = new Date(endDate);
      weekEnd.setDate(weekEnd.getDate() + 1);

      if (today >= startDate && today <= weekEnd) {
        return { meso: mesoKey, semana: i + 1 };
      }
    }
  }
  return null;
}

function migrateOldData() {
  const hasOldData = localStorage.getItem('hgRegistros') || localStorage.getItem('cut-datos') || localStorage.getItem('rehab-datos');

  // Sin datos viejos = dispositivo nuevo o usuario nuevo = nada que migrar
  if (!hasOldData) return;

  // Registrar quién es el usuario original (el que tenía datos antes del multi-usuario)
  const originalUser = localStorage.getItem('forge-original-user');
  if (!originalUser) {
    localStorage.setItem('forge-original-user', state.currentUser);
  } else if (originalUser !== state.currentUser) {
    // Usuario nuevo: limpiar datos que pudieron copiarse incorrectamente en una versión anterior
    const cleanKey = 'forge-new-user-clean-v1-' + state.currentUser;
    if (!localStorage.getItem(cleanKey)) {
      localStorage.removeItem(uk('cut-datos'));
      localStorage.removeItem(uk('rehab-datos'));
      localStorage.setItem(cleanKey, '1');
    }
    // Segunda pasada: descontaminar cut-datos que pudo llegar vía fallback a data.json
    // (bug ya corregido en pullFromGithub). Corre una sola vez por usuario nuevo.
    const decontamKey = 'forge-cross-user-decontam-v1-' + state.currentUser;
    if (!localStorage.getItem(decontamKey)) {
      localStorage.removeItem(uk('cut-datos'));
      localStorage.setItem(decontamKey, '1');
    }
    return; // Nunca migrar datos del usuario original a usuarios nuevos
  }

  // Solo llega aquí el usuario original — migra con merge por timestamp
  const oldRegistros = localStorage.getItem('hgRegistros');
  if (oldRegistros) {
    try {
      const old = JSON.parse(oldRegistros);
      const newKey = uk('hgRegistros');
      const existing = JSON.parse(localStorage.getItem(newKey) || '{}');
      let changed = false;
      Object.entries(old).forEach(([k, v]) => {
        const exTs = existing[k]?.timestamp || '';
        const oldTs = v?.timestamp || '';
        if (!existing[k] || oldTs > exTs) { existing[k] = v; changed = true; }
      });
      if (changed) localStorage.setItem(newKey, JSON.stringify(existing));
    } catch(e) {}
  }
  ['rehab-datos', 'cut-datos', 'forge-position'].forEach(key => {
    const newKey = uk(key);
    if (!localStorage.getItem(newKey) && localStorage.getItem(key)) {
      localStorage.setItem(newKey, localStorage.getItem(key));
    }
  });

  // Reparación única: si la clave nueva ya existía (vacía o parcial) cuando
  // corrió la copia de arriba, los registros viejos de cut-datos quedaron
  // huérfanos bajo la clave legacy y nunca se migraron. Mergea por campo
  // sin pisar nada de lo que ya esté en la clave nueva.
  const repairKey = 'forge-cut-legacy-merge-v1-' + state.currentUser;
  if (!localStorage.getItem(repairKey)) {
    const legacyCutRaw = localStorage.getItem('cut-datos');
    if (legacyCutRaw) {
      try {
        const legacy = JSON.parse(legacyCutRaw);
        const newKey = uk('cut-datos');
        const current = JSON.parse(localStorage.getItem(newKey) || '{}');
        ['registrosDiarios', 'registrosSemanales', 'registrosMensuales'].forEach(field => {
          if (legacy[field] && Object.keys(legacy[field]).length) {
            current[field] = Object.assign({}, legacy[field], current[field] || {});
          }
        });
        if (!current.setup && legacy.setup) current.setup = legacy.setup;
        localStorage.setItem(newKey, JSON.stringify(current));
      } catch(e) {}
    }
    localStorage.setItem(repairKey, '1');
  }
}

function initApp() {
  // Wipe único de cut-datos para dolly: la app era monousuario y sus datos
  // se mezclaron con los de samuel. Se limpia una sola vez y se bloquea el
  // pull de cut hasta que ella haga su propio setup.
  if (state.currentUser === 'dolly' && !localStorage.getItem('forge-dolly-cut-wipe-v1')) {
    localStorage.removeItem(uk('cut-datos'));
    localStorage.setItem('forge-cut-pull-blocked-dolly', '1');
    localStorage.setItem('forge-dolly-cut-wipe-v1', '1');
  }
  migrateOldData();
  loadLocal();
  const userMesos = USUARIOS[state.currentUser]?.mesociclos || [];
  const pos = detectPosition();
  if (pos && userMesos.includes(pos.meso)) {
    state.meso = pos.meso;
    state.semana = pos.semana;
    const diasSemana = ['dom','lun','mar','mie','jue','vie','sab'];
    const diaSemana = diasSemana[new Date().getDay()];
    const diasMeso = MESOCICLOS[pos.meso].dias.map(d => d.key);
    state.dia = diasMeso.includes(diaSemana) ? diaSemana : diasMeso[0];
  } else if (userMesos.length > 0) {
    const saved = localStorage.getItem(uk('forge-position'));
    if (saved) {
      try {
        const p = JSON.parse(saved);
        if (p.meso && MESOCICLOS[p.meso] && userMesos.includes(p.meso)) {
          state.meso = p.meso;
          state.semana = p.semana || 1;
          state.dia = p.dia || MESOCICLOS[p.meso].dias[0].key;
        }
      } catch(e) {}
    } else {
      const defaultMeso = userMesos[userMesos.length - 1];
      state.meso = defaultMeso;
      state.dia = MESOCICLOS[defaultMeso].dias[0].key;
    }
  }
  const chip = document.getElementById('userChip');
  if (chip) chip.textContent = state.currentUser.charAt(0).toUpperCase() + state.currentUser.slice(1);
  const rehabNav = document.getElementById('nav-rehab');
  if (rehabNav) rehabNav.style.display = USUARIOS[state.currentUser]?.tieneRehab ? '' : 'none';
  const tieneHabitos = !!USUARIOS[state.currentUser]?.tieneHabitos;
  const actividadNav = document.getElementById('nav-actividad');
  const habitosNav = document.getElementById('nav-habitos');
  if (actividadNav) actividadNav.style.display = tieneHabitos ? 'none' : '';
  if (habitosNav)   habitosNav.style.display   = tieneHabitos ? '' : 'none';
  if (tieneHabitos && state.view === 'actividad') state.view = 'habitos';
  render();
  setTimeout(() => {
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = document.body.classList.contains('dark') ? '🌙' : '☀️';
  }, 0);
  if (state.githubToken) pullFromGithub();
}

function renderUserPicker() {
  const cards = document.getElementById('pickerCards');
  if (!cards) return;
  const users = Object.keys(USUARIOS);
  cards.innerHTML = users.map(function(u) {
    var profile = {};
    try { profile = JSON.parse(localStorage.getItem(u + '-user-profile') || '{}'); } catch(e) {}
    var capName = profile.displayName || (u.charAt(0).toUpperCase() + u.slice(1));
    var initials = u.slice(0, 2).toUpperCase();
    var avatarInner = profile.photoData
      ? '<img src="' + profile.photoData + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%">'
      : initials;
    return '<div class="picker-card" onclick="selectUser(\'' + u + '\')">'
      + '<div class="picker-avatar">' + avatarInner + '</div>'
      + '<div class="picker-name">' + capName + '</div>'
      + '</div>';
  }).join('');
}

function selectUser(name) {
  state.currentUser = name;
  localStorage.setItem("forge-currentUser", name);
  document.getElementById("userPicker").style.display = "none";
  initApp();
}

function switchUser() {
  if (!confirm(`Cambiar usuario (actualmente: ${state.currentUser})`)) return;
  localStorage.removeItem("forge-currentUser");
  state.currentUser = "";
  renderUserPicker();
  document.getElementById("userPicker").style.display = "flex";
}

// Arranque
renderUserPicker();
if (state.currentUser) {
  document.getElementById("userPicker").style.display = "none";
  initApp();
}
</script>
