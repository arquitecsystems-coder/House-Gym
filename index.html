<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forge">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#5C7A00">
<link rel="apple-touch-startup-image" media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash-828x1792.png">
<title>Forge</title>
<style>
  /* ── TOKENS ── */
  :root {
    --bg:       #F7F7F5;
    --surface:  #FFFFFF;
    --card:     #FFFFFF;
    --border:   #E5E5E3;
    --accent:   #5C7A00;
    --accent2:  #C0392B;
    --text:     #1A1A1A;
    --muted:    #999;
    --ok:       #2E7D32;
    --ok-bg:    #E8F5E9;
    --accent-bg:#F5FFD0;
    --font-mono: 'SF Mono', 'Fira Mono', monospace;
    --font:     -apple-system, 'Segoe UI', sans-serif;
    --radius:   10px;
  }

  body.dark {
    --bg:       #0d0d0d;
    --surface:  #161616;
    --card:     #1e1e1e;
    --border:   #2a2a2a;
    --accent:   #c8ff00;
    --accent2:  #ff6b35;
    --text:     #f0f0f0;
    --muted:    #666;
    --ok:       #3ddc84;
    --ok-bg:    #1a3a20;
    --accent-bg:#1a2000;
  }

  /* Dark mode overrides for form elements */
  body.dark input,
  body.dark select,
  body.dark textarea {
    background: #1e1e1e !important;
    color: #f0f0f0 !important;
    border-color: #2a2a2a !important;
  }

  body.dark input:focus,
  body.dark select:focus,
  body.dark textarea:focus {
    border-color: #c8ff00 !important;
  }

  body.dark input::placeholder,
  body.dark textarea::placeholder {
    color: #555 !important;
  }

  body.dark .set-input.filled {
    background: #1a2a0a !important;
    border-color: #2a3a1a !important;
    color: #f0f0f0 !important;
  }

  body.dark .rehab-input,
  body.dark .cut-input,
  body.dark .config-input {
    background: #161616 !important;
    color: #f0f0f0 !important;
  }

  body.dark .session-note {
    background: #161616 !important;
    color: #f0f0f0 !important;
  }

  body.dark .set-rir {
    background: #1e1e1e !important;
    color: #f0f0f0 !important;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 15px;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* ── HEADER ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .logo {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .sync-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: var(--font-mono);
  }

  .sync-btn.syncing { color: var(--accent); border-color: var(--accent); }
  .sync-btn.error   { color: var(--accent2); border-color: var(--accent2); }

  /* ── MESO SELECTOR ── */
  .meso-tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .meso-tabs::-webkit-scrollbar { display: none; }

  .meso-tab {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .meso-tab.active {
    background: var(--accent);
    color: #FFFFFF;
    border-color: var(--accent);
    font-weight: 700;
  }

  /* ── WEEK / DAY NAV ── */
  .nav-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-bar::-webkit-scrollbar { display: none; }

  .week-btn {
    flex-shrink: 0;
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .week-btn.active { border-color: var(--accent); color: var(--accent); }

  /* ── DAY TABS ── */
  .day-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    flex: 1;
    min-width: 70px;
    padding: 10px 6px;
    text-align: center;
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .day-tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .day-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--ok);
    margin-left: 4px;
    vertical-align: middle;
  }

  /* ── MAIN CONTENT ── */
  main { padding: 16px 16px; max-width: 600px; margin: 0 auto; }

  .session-header {
    margin-bottom: 16px;
  }

  .session-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }

  .session-sub {
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  /* ── EXERCISE CARD ── */
  .exercise-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: visible;
  }

  .exercise-body {
    overflow: hidden;
    border-radius: 0 0 var(--radius) var(--radius);
    background: var(--card);
  }

  .exercise-header {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }

  .exercise-name {
    font-weight: 600;
    font-size: 14px;
  }

  .exercise-meta {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  .exercise-badge {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 3px 7px;
    border-radius: 4px;
    background: var(--border);
    color: var(--muted);
    flex-shrink: 0;
  }

  .exercise-badge.done { background: var(--ok-bg); color: var(--ok); }

  /* ── PLAN ROW (semana a semana) ── */
  .plan-weeks {
    padding: 8px 14px 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .plan-week-chip {
    flex-shrink: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  .plan-week-chip.current {
    border-color: var(--accent);
    color: var(--accent);
    background: #F5FFD0;
    font-weight: 700;
  }

  /* ── SETS ── */
  .sets-container {
    padding: 0 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .set-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 60px 32px;
    gap: 6px;
    align-items: center;
  }

  .set-num {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
    text-align: center;
  }

  .set-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 7px 8px;
    width: 100%;
    text-align: center;
    -webkit-appearance: none;
  }

  .set-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .set-input.filled { border-color: #C5E06A; background: #F5FFD0; }

  .set-rir {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 4px;
    width: 100%;
    text-align: center;
    -webkit-appearance: none;
  }

  .set-rir:focus { outline: none; border-color: var(--accent); }

  .set-check {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    color: var(--muted);
    transition: all 0.15s;
    flex-shrink: 0;
  }

  .set-check.checked {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }

  .set-labels {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 60px 32px;
    gap: 6px;
    padding: 0 14px 6px;
  }

  .set-label {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    text-align: center;
  }

  /* ── PROGRESS COMPARISON ── */
  .comparison {
    margin: 0 14px 12px;
    background: var(--surface);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .comp-item { text-align: center; }

  .comp-val {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
  }

  .comp-label {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
    margin-top: 1px;
  }

  .comp-arrow { color: var(--muted); font-size: 14px; }
  .comp-up { color: var(--ok); }
  .comp-down { color: var(--accent2); }
  .comp-same { color: var(--muted); }

  /* ── RM PANEL ── */
  .rm-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .rm-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .rm-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .rm-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }

  .rm-row:last-child { border-bottom: none; }

  .rm-ex { flex: 1; font-size: 13px; }

  .rm-val {
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--accent);
    min-width: 90px;
    text-align: right;
  }

  .rm-meso {
    font-size: 10px;
    color: var(--muted);
    font-family: var(--font-mono);
    min-width: 30px;
  }

  /* ── CONFIG PANEL ── */
  .config-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .config-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .config-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }

  .config-label {
    font-size: 12px;
    color: var(--muted);
  }

  .config-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 9px 12px;
    width: 100%;
  }

  .config-input:focus { outline: none; border-color: var(--accent); }

  .config-btn {
    background: var(--accent);
    color: #FFFFFF;
    border: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    padding: 11px;
    width: 100%;
    cursor: pointer;
    font-family: var(--font);
  }

  /* ── BOTTOM NAV ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 10px 4px 12px;
    cursor: pointer;
    color: var(--muted);
    font-size: 10px;
    font-family: var(--font-mono);
    gap: 4px;
    transition: color 0.15s;
  }

  .nav-item.active { color: var(--accent); }

  .nav-icon { font-size: 18px; }

  /* ── TIMER BAR ── */
  #timerBar {
    position: fixed;
    bottom: 57px;
    left: 0;
    right: 0;
    z-index: 99;
    background: var(--accent);
    color: #fff;
    display: none;
    align-items: center;
    padding: 8px 12px 18px;
    gap: 8px;
    font-family: var(--font-mono);
    border-top: 1px solid rgba(255,255,255,0.15);
    transition: background 0.25s;
  }
  #timerBar.visible { display: flex; }
  body.dark #timerBar { color: #000; }
  #timerBar .tb-label {
    flex: 1;
    font-size: 11px;
    opacity: 0.85;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #timerBar .tb-count {
    font-size: 18px;
    font-weight: 700;
    min-width: 46px;
    text-align: center;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #timerBar .tb-btn {
    background: rgba(255,255,255,0.22);
    border: none;
    border-radius: 6px;
    color: #fff;
    cursor: pointer;
    padding: 5px 9px;
    font-size: 13px;
    font-family: var(--font-mono);
    line-height: 1;
  }
  body.dark #timerBar .tb-btn { background: rgba(0,0,0,0.2); color: #000; }
  #timerBar.done { background: #22c55e; animation: timerPulse 0.7s ease-in-out infinite; }
  #timerBar.urgent { background: #ef4444; }
  body.dark #timerBar.done,
  body.dark #timerBar.urgent { color: #000; }
  @keyframes timerPulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.45; }
  }

  /* ── ESTADO VACÍO ── */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  /* ── SESSION NOTE ── */
  .session-note-wrap {
    margin-bottom: 14px;
  }

  .session-note {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 10px 12px;
    resize: none;
    min-height: 60px;
    line-height: 1.5;
  }

  .session-note:focus {
    outline: none;
    border-color: var(--accent);
  }

  .session-note::placeholder { color: var(--muted); }

  /* ── REHAB ── */
  .rehab-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .rehab-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .rehab-progress-bar {
    background: var(--border);
    border-radius: 99px;
    height: 10px;
    margin: 8px 0 4px;
    overflow: hidden;
  }

  .rehab-progress-fill {
    height: 100%;
    border-radius: 99px;
    background: var(--accent);
    transition: width 0.4s ease;
  }

  .rehab-progress-fill.done { background: var(--ok); }

  .rehab-meta {
    display: flex;
    justify-content: space-between;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 12px;
  }

  .rehab-log-row {
    display: grid;
    grid-template-columns: 1fr 80px 80px 32px;
    gap: 6px;
    align-items: center;
    margin-bottom: 6px;
  }

  .rehab-log-label {
    font-size: 12px;
    color: var(--text);
  }

  .rehab-log-date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
  }

  .rehab-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    padding: 6px 8px;
    width: 100%;
    text-align: center;
  }

  .rehab-input:focus { outline: none; border-color: var(--accent); }

  .rehab-add-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    width: 32px;
    height: 32px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .rehab-criterion {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .rehab-criterion:last-child { border-bottom: none; }

  .rehab-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    transition: all 0.15s;
  }

  .rehab-check.ok {
    background: var(--ok);
    border-color: var(--ok);
    color: #fff;
  }

  .rehab-history-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono);
    font-size: 12px;
  }

  .rehab-history-row:last-child { border-bottom: none; }

  .rehab-heatmap-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 3px;
  }

  .rehab-heatmap-dow {
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--muted);
    text-align: center;
    padding-bottom: 3px;
  }

  .rehab-heatmap-cell {
    aspect-ratio: 1;
    border-radius: 3px;
    cursor: pointer;
    min-height: 14px;
    transition: opacity 0.1s;
  }

  .rehab-heatmap-cell:hover { opacity: 0.75; }

  .rehab-heatmap-tooltip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-top: 8px;
  }


  /* ── CUT ── */
  .cut-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  .cut-title {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .cut-stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 12px;
  }

  .cut-stat {
    background: var(--bg);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .cut-stat-val {
    font-family: var(--font-mono);

function getTestDatos() {
  try { return JSON.parse(localStorage.getItem(uk("test-datos")) || "{}"); }
  catch(e) { return {}; }
}

function saveTestDatos(d) {
  localStorage.setItem(uk("test-datos"), JSON.stringify(d));
}

function saveTestField(dia, exIdx, campo, valor) {
  const datos = getTestDatos();
  if (!datos[dia]) datos[dia] = {};
  const nombre = TEST_DOLLY.ejercicios[dia][exIdx].nombre;
  if (!datos[dia][nombre]) datos[dia][nombre] = {};
  if (valor !== "" && valor !== null) datos[dia][nombre][campo] = valor;
  else delete datos[dia][nombre][campo];

  // Actualizar visual de la card sin re-renderizar
  const ej = TEST_DOLLY.ejercicios[dia][exIdx];
  const r = datos[dia][nombre];
  const ejDone = r && ej.registrar.every(c => r[c]);
  const card = document.getElementById(`test-card-${dia}-${exIdx}`);
  if (card) {
    card.style.borderColor = ejDone ? "var(--ok)" : "var(--border)";
    const badge = card.querySelector(".test-badge");
    if (badge) badge.textContent = ejDone ? "✓" : "";
  }

  // Progreso del día
  const ejercicios = TEST_DOLLY.ejercicios[dia];
  const done = ejercicios.filter((e, i2) => {
    const r2 = datos[dia]?.[e.nombre];
    return r2 && e.registrar.every(c => r2[c]);
  }).length;
  const progEl = document.getElementById("test-progress");
  if (progEl) progEl.textContent = `${done}/${ejercicios.length} completados`;

  // Actualizar chips de días
  TEST_DOLLY.dias.forEach(d => {
    const total = TEST_DOLLY.ejercicios[d.key].length;
    const doneDia = TEST_DOLLY.ejercicios[d.key].filter(e => {
      const r3 = datos[d.key]?.[e.nombre];
      return r3 && e.registrar.every(c => r3[c]);
    }).length;
    const chip = document.getElementById(`test-day-chip-${d.key}`);
    if (chip) chip.textContent = `${doneDia}/${total}`;
  });

  // Verificar completado total
  let allDone = true;
  for (const d of ["sab", "dom"]) {
    for (const e of TEST_DOLLY.ejercicios[d]) {
      const r4 = datos[d]?.[e.nombre];
      if (!r4 || e.registrar.some(c => !r4[c])) { allDone = false; break; }
    }
    if (!allDone) break;
  }
  if (allDone && !datos.completado) {
    datos.completado = true;
    showToast("Test completado — resultados guardados ✓", "ok");
    const banner = document.getElementById("test-completado-banner");
    if (banner) banner.style.display = "block";
  }

  saveTestDatos(datos);
  queueSync();
}

async function loadExerciseGif(elementId, searchTerm) {
  try {
    let gifUrl;
    if (searchTerm.startsWith('https://')) {
      gifUrl = searchTerm;
    } else {
      const r = await fetch(
        `https://api.tenor.com/v1/search?q=${encodeURIComponent(searchTerm)}&key=LIVDSRZULELA&limit=1&media_filter=minimal&contentfilter=high`,
        { cache: "force-cache" }
      );
      const data = await r.json();
      gifUrl = data.results?.[0]?.media?.[0]?.tinygif?.url;
    }
    if (gifUrl) {
      const el = document.getElementById(elementId);
      if (el) { el.src = gifUrl; el.style.display = "block"; }
    }
  } catch(e) {}
}

function renderSession(main) {
  const usuarioCfg = USUARIOS[state.currentUser] || {};
  if (usuarioCfg.renderTest === 'dolly') { renderTestDolly(main); return; }
  if (!usuarioCfg.mesociclos?.length) {
    main.innerHTML = '<div style="padding:48px 16px;text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:13px">Programa en construcción<br><span style="font-size:11px;opacity:0.6">Tu mesociclo se diseña en base al test inicial</span></div>';
    return;
  }
  const meso = MESOCICLOS[state.meso];

  // Nav semanas
  let html = `<div class="nav-bar">`;
  for (let s = 1; s <= meso.semanas; s++) {
    let label, sublabel = "";
    if (s === meso.semanas) label = `S${s} — Desc`;
    else if (s === meso.semanas - 1) label = `S${s} — Pico`;
    else label = `S${s}`;
    if (meso.fechas && meso.fechas[s-1]) sublabel = meso.fechas[s-1];
    const subHtml = sublabel ? '<span style="display:block;font-size:9px;opacity:0.7;margin-top:1px">'+sublabel+'</span>' : "";
    html += '<button class="week-btn ' + (state.semana === s ? "active" : "") + '" onclick="setSemana('+s+')">'
          + '<span style="display:block">'+label+'</span>'
          + subHtml
          + '</button>';
  }
  html += `</div>`;

  // Day tabs
  html += `<div class="day-tabs">`;
  meso.dias.forEach(d => {
    const done = diaCompleto(state.meso, state.semana, d.key);
    html += `<div class="day-tab ${state.dia === d.key ? "active" : ""}"
      onclick="setDia('${d.key}')">
      ${d.label}${done ? '<span class="day-dot"></span>' : ""}
    </div>`;
  });
  html += `</div>`;

  main.innerHTML = html;

  // Contenido del día
  const diaInfo = meso.dias.find(d => d.key === state.dia);
  const planDia = meso.plan[state.dia] || [];
  const fecha = meso.fechas ? meso.fechas[state.semana - 1] : null;
  const noteKey = `nota-sesion-${state.meso}-S${state.semana}-${state.dia}`;
  const notaActual = state.registros[noteKey]?.nota || "";

  let content = `<div style="padding:16px 16px 0">
    <div class="session-header">
      <div class="session-title">${diaInfo?.titulo || ""}</div>

    content += renderEjercicioCard(ejercicio, state.meso, state.semana, state.dia);

// ── EJERCICIO CARD ──
function renderEjercicioCard(ej, meso, semana, dia) {
  const planActual = ej.semanas[semana - 1] || "—";
  const key = (n, s) => `${meso}-S${semana}-${dia}-${ej.nombre}-${s}`;
  const allChecked = Array.from({length: ej.series}, (_, i) => i + 1)
    .every(s => state.registros[key(ej.nombre, s)]?.checked);

  // Progresión por semanas
  let weeksHtml = ej.semanas.map((w, i) =>
    `<div class="plan-week-chip ${i + 1 === semana ? "current" : ""}">S${i+1}: ${w}</div>`
  ).join("");

  // Comparación vs semana anterior
  let compHtml = "";
  if (semana > 1) {
    const prevPlan = ej.semanas[semana - 2];
    compHtml = `<div class="comparison">
      <div class="comp-item">
        <div class="comp-val" style="color:var(--muted)">${prevPlan}</div>
        <div class="comp-label">S${semana-1}</div>
      </div>
      <div class="comp-arrow">→</div>
      <div class="comp-item">
        <div class="comp-val" style="color:var(--accent)">${planActual}</div>
        <div class="comp-label">S${semana} objetivo</div>
      </div>
    </div>`;
  }

  // Sets
  let labelsHtml = `<div class="set-labels">
    <div class="set-label"></div>
    <div class="set-label">kg / lb</div>
    <div class="set-label">reps</div>
    <div class="set-label">RIR</div>
    <div class="set-label">✓</div>
  </div>`;

  let setsHtml = `<div class="sets-container">`;
  for (let s = 1; s <= ej.series; s++) {
    const k = key(ej.nombre, s);
    const reg = state.registros[k] || {};
    const filled = reg.peso || reg.reps;
    setsHtml += `<div class="set-row">
      <div class="set-num">${s}</div>
      <input class="set-input ${filled ? 'filled' : ''}"
        type="text" inputmode="decimal"
        placeholder="—"
        value="${reg.peso || ""}"
        onchange="saveField('${k}','peso',this.value)"
        onfocus="this.select()">
      <input class="set-input ${filled ? 'filled' : ''}"
        type="text" inputmode="numeric"
        placeholder="—"
        value="${reg.reps || ""}"
        onchange="saveField('${k}','reps',this.value)"
        onfocus="this.select()">
      <select class="set-rir" onchange="saveField('${k}','rir',this.value)">
        <option value="">—</option>
        ${[0,1,2,3,4].map(r =>
          `<option value="${r}" ${reg.rir == r ? "selected" : ""}>${r}</option>`
        ).join("")}
      </select>
      <button class="set-check ${reg.checked ? 'checked' : ''}"
        onclick="toggleCheck('${k}')">
        ${reg.checked ? "✓" : ""}
      </button>
    </div>`;
  }
  setsHtml += `</div>`;

  return `<div class="exercise-card">
    <div class="exercise-header" onclick="toggleCard(this)">
      <div>
        <div class="exercise-name">${ej.nombre}</div>
        <div class="exercise-meta">${ej.series} series — objetivo: ${planActual}</div>
      </div>
      <div class="exercise-badge ${allChecked ? 'done' : ''}">
        ${allChecked ? "✓ hecho" : (ej.series+"s")}
      </div>
    </div>
    <div class="plan-weeks">${weeksHtml}</div>
    <div class="exercise-body">
      ${compHtml}
      ${labelsHtml}
      ${setsHtml}
    </div>
  </div>`;
}

function toggleCard(header) {
  const weeks = header.nextElementSibling;
  const body = weeks.nextElementSibling;
  const hidden = body.style.display === "none";
  weeks.style.display = hidden ? "" : "none";
  body.style.display = hidden ? "" : "none";
}

// ── REHAB VIEW ──
const REHAB_EJERCICIOS = [
  {
    id: "rodilla_pared",
    nombre: "Rodilla a pared",
    sets: 3,
    objetivoSeg: 120,
    protocolo: "Hold 2 min en rango máximo · descanso 30 s entre sets",
    nota: "Empuja 1 mm más dentro del hold si sientes que la tensión cede"
  },
  {
    id: "cuadrupedia",
    nombre: "Cuadrupedia — desliz rodilla",
    sets: 3,
    objetivoSeg: 120,
    protocolo: "Hold 2 min en rango máximo · descanso 30 s entre sets",
    nota: "4 puntos de apoyo, talón pegado al suelo"
  },
  {
    id: "equilibrio",
    nombre: "Equilibrio monopodal ojos cerrados",
    sets: 2,
    objetivoSeg: 45,
    protocolo: "Hasta fallo · registra tiempo",
    nota: "Superficie firme → inestable cuando superes 45 s consistente"
  },
];

function normalizeRehabSet(raw, objetivoSeg) {
  if (raw && typeof raw === 'object') return { tiempo: raw.tiempo != null ? raw.tiempo : null, completado: !!raw.completado };
  if (raw === true) return { tiempo: objetivoSeg, completado: true };
  return { tiempo: null, completado: false };
}

function migrateRehabSesiones(datos) {
  if (!datos.sesiones) return false;
  let changed = false;
  Object.values(datos.sesiones).forEach(dia => {
    if (!dia || typeof dia !== 'object') return;
    REHAB_EJERCICIOS.forEach(ej => {
      const raw = dia[ej.id];
      if (!Array.isArray(raw)) return;
      if (raw.some(v => typeof v === 'boolean')) {
        dia[ej.id] = raw.map(v => normalizeRehabSet(v, ej.objetivoSeg));
        changed = true;
      }
    });
  });
  return changed;
}

function getRehabDatos() {
  try {
    const raw = localStorage.getItem(uk("rehab-datos"));
    const datos = raw ? JSON.parse(raw) : {};
    if (migrateRehabSesiones(datos)) saveRehabDatos(datos);
    return datos;
  } catch(e) { return {}; }
}

function saveRehabDatos(datos) {
  localStorage.setItem(uk("rehab-datos"), JSON.stringify(datos));
}

function getRehabDayScore(sesionDia) {
  if (!sesionDia) return 0;
  const totalObj = REHAB_EJERCICIOS.reduce(function(a, ej) { return a + ej.sets * ej.objetivoSeg; }, 0);
  if (!totalObj) return 0;
  let contrib = 0;
  REHAB_EJERCICIOS.forEach(function(ej) {
    var sets = sesionDia[ej.id] || [];
    sets.forEach(function(s) {
      var norm = normalizeRehabSet(s, ej.objetivoSeg);
      if (norm.completado) {
        contrib += Math.min(norm.tiempo != null ? norm.tiempo : ej.objetivoSeg, ej.objetivoSeg);
      }
    });
  });
  return contrib / totalObj;
}

function getHeatmapColor(score, isDark) {
  if (score <= 0) return isDark ? '#2a2a2a' : '#E5E5E3';
  if (score < 0.5) return '#F9A825';
  if (score < 1) return '#81C784';
  return '#2E7D32';
}

function dayHasActivity(sesionDia) {
  if (!sesionDia) return false;
  return REHAB_EJERCICIOS.some(function(ej) {
    var sets = sesionDia[ej.id] || [];
    return sets.some(function(s) { return normalizeRehabSet(s, ej.objetivoSeg).completado; });
  });
}

function renderRehab(main) {
  const TARGET_CM = 7;
  const datos = getRehabDatos();
  const mediciones = datos.mediciones || [];
  const sesiones = datos.sesiones || {};
  const isDark = document.body.classList.contains('dark');

  const _hoy = new Date();
  const hoy = _hoy.getFullYear()+'-'+String(_hoy.getMonth()+1).padStart(2,'0')+'-'+String(_hoy.getDate()).padStart(2,'0');
  const esDomingo = _hoy.getDay() === 0;
  const sesionHoy = sesiones[hoy] || {};

  const ultima = mediciones.length ? mediciones[mediciones.length - 1].valor : 4;
  const pct = Math.min(100, (ultima / TARGET_CM) * 100);
  const reached = ultima >= TARGET_CM;

  // Racha: basta con al menos un set completado en el dia
  let streak = 0;
  const _sd = new Date();
  while (true) {
    const sk = _sd.getFullYear()+'-'+String(_sd.getMonth()+1).padStart(2,'0')+'-'+String(_sd.getDate()).padStart(2,'0');
    if (dayHasActivity(sesiones[sk])) { streak++; _sd.setDate(_sd.getDate()-1); }
    else break;
  }

  let html = '<div style="padding:16px 16px 0;max-width:600px;margin:0 auto">';

  // Header
  html += '<div class="rehab-card" style="display:flex;align-items:center;gap:16px;padding:14px 16px">'
    + '<div style="flex:1">'
    + '<div style="font-size:11px;font-family:var(--font-mono);color:var(--muted);margin-bottom:2px">DORSIFLEXION ACTUAL</div>'
    + '<div style="display:flex;align-items:baseline;gap:6px">'
    + '<span style="font-family:var(--font-mono);font-size:32px;font-weight:700;color:'+(reached?'var(--ok)':'var(--accent)')+'">'+ultima+'</span>'
    + '<span style="font-size:13px;color:var(--muted)">cm / '+TARGET_CM+' cm</span>'
    + '</div>'
    + '<div class="rehab-progress-bar" style="margin-top:6px">'
    + '<div class="rehab-progress-fill '+(reached?'done':'')+'" style="width:'+pct+'%"></div>'
    + '</div>'
    + '<div style="font-size:11px;color:var(--muted);font-family:var(--font-mono);margin-top:4px">'
    + (reached ? '&#10003; Objetivo alcanzado' : 'Faltan '+(TARGET_CM-ultima).toFixed(1)+' cm')
    + '</div></div>'
    + '<div style="text-align:center;border-left:1px solid var(--border);padding-left:16px;min-width:64px">'
    + '<div style="font-family:var(--font-mono);font-size:28px;font-weight:700;color:var(--accent)">'+streak+'</div>'
    + '<div style="font-size:10px;color:var(--muted);font-family:var(--font-mono)">días seguidos</div>'
    + '</div></div>';

  // Banner domingo
  if (esDomingo) {
    html += '<div style="background:var(--accent-bg);border:1px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px">'
      + '<div>'
      + '<div style="font-size:13px;font-weight:600;color:var(--accent)">&#128207; Día de medición</div>'
      + '<div style="font-size:11px;color:var(--muted);margin-top:2px">Mide rodilla a pared y registra el resultado</div>'
      + '</div>'
      + '<button class="rehab-add-btn" onclick="showMedicionModal()" style="flex-shrink:0;width:auto;padding:0 12px;font-size:12px;font-family:var(--font-mono)">Registrar</button>'
      + '</div>';
  }

  // Sesion de hoy
  html += '<div class="rehab-card"><div class="rehab-title">Hoy — '+hoy+'</div>';

  REHAB_EJERCICIOS.forEach(function(ej) {
    const setsEj = sesionHoy[ej.id] || [];
    const setsNorm = Array.from({length: ej.sets}, function(_, i) { return normalizeRehabSet(setsEj[i], ej.objetivoSeg); });
    const completados = setsNorm.filter(function(s) { return s.completado; }).length;
    const fullCount = setsNorm.filter(function(s) { return s.completado && (s.tiempo == null || s.tiempo >= ej.objetivoSeg); }).length;
    const todoOk = fullCount === ej.sets;

    html += '<div style="padding:10px 0;border-bottom:1px solid var(--border)">'
      + '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px">'
      + '<div>'
      + '<div style="font-size:14px;font-weight:600">'+ej.nombre+'</div>'
      + '<div style="font-size:11px;color:var(--muted);margin-top:2px">'+ej.protocolo+'</div>'
      + '</div>'
      + '<div style="font-family:var(--font-mono);font-size:11px;color:'+(todoOk?'var(--ok)':'var(--muted)')+';white-space:nowrap;padding-top:2px">'
      + completados+'/'+ej.sets+' sets'
      + '</div></div>';

    setsNorm.forEach(function(s, i) {
      const full = s.completado && (s.tiempo == null || s.tiempo >= ej.objetivoSeg);
      const partial = s.completado && s.tiempo != null && s.tiempo < ej.objetivoSeg;
      const cBorder = full ? 'var(--ok)' : partial ? '#F9A825' : 'var(--border)';
      const cBg    = full ? 'var(--ok)' : partial ? '#F9A825' : 'transparent';
      const cFg    = (full || partial) ? '#fff' : 'var(--muted)';
      const cLabel = full ? '&#10003;' : partial ? '~' : String(i+1);
      const statusNote = partial ? ' · parcial' : '';

      html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:5px">'
        + '<button onclick="toggleRehabSet(\''+hoy+'\',\''+ej.id+'\','+i+')"'
        + ' style="width:28px;height:28px;border-radius:50%;border:2px solid '+cBorder+';background:'+cBg+';color:'+cFg+';font-size:11px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1">'
        + cLabel+'</button>'
        + '<input type="number" min="0" max="999"'
        + ' value="'+(s.tiempo != null ? s.tiempo : '')+'"'
        + ' placeholder="'+ej.objetivoSeg+'"'
        + ' class="rehab-input"'
        + ' style="width:72px;padding:4px 6px;font-size:14px;border-color:'+cBorder+'"'
        + ' onchange="saveRehabSetTime(\''+hoy+'\',\''+ej.id+'\','+i+',this.value)">'
        + '<span style="font-size:11px;color:var(--muted);font-family:var(--font-mono)">'+ej.objetivoSeg+'s'+statusNote+'</span>'
        + '</div>';
    });

    html += '<div style="font-size:11px;color:var(--muted);font-style:italic;margin-top:4px">'+ej.nota+'</div>'
      + '</div>';
  });

  const notaSesion = sesionHoy.nota || '';
  html += '<div style="margin-top:10px">'
    + '<textarea class="session-note" placeholder="Como se sintio? Llegaste mas lejos que ayer?"'
    + ' onchange="saveRehabNota(\''+hoy+'\', this.value)">'+notaSesion+'</textarea>'
    + '</div></div>';

  // Heatmap 8 semanas
  const todayMid = new Date(_hoy.getFullYear(), _hoy.getMonth(), _hoy.getDate());
  const dowToday = todayMid.getDay();
  const daysToMon = (dowToday + 6) % 7;
  const thisMonday = new Date(todayMid.getTime() - daysToMon * 86400000);

  // Rango dinamico: desde la semana del primer registro hasta hoy
  const allSessionDates = Object.keys(sesiones).sort();
  let hmStart = thisMonday;
  if (allSessionDates.length) {
    const fp = allSessionDates[0].split('-');
    const firstDate = new Date(parseInt(fp[0]), parseInt(fp[1])-1, parseInt(fp[2]));
    const firstDow = (firstDate.getDay() + 6) % 7;
    hmStart = new Date(firstDate.getTime() - firstDow * 86400000);
  }
  const numWeeks = Math.max(1, Math.round((thisMonday.getTime() - hmStart.getTime()) / (7 * 86400000)) + 1);

  html += '<div class="rehab-card">'
    + '<div class="rehab-title" style="margin-bottom:10px">Historial</div>'
    + '<div class="rehab-heatmap-grid">';

  ['L','M','X','J','V','S','D'].forEach(function(d) {
    html += '<div class="rehab-heatmap-dow">'+d+'</div>';
  });

  // Semanas mas antiguas arriba (row 0), semana actual abajo (ultima fila)
  for (let row = 0; row < numWeeks; row++) {
    for (let col = 0; col < 7; col++) {
      const cellDate = new Date(hmStart.getTime() + (row * 7 + col) * 86400000);
      const cellStr = cellDate.getFullYear()+'-'+String(cellDate.getMonth()+1).padStart(2,'0')+'-'+String(cellDate.getDate()).padStart(2,'0');
      const isFuture = cellDate > todayMid;
      const isToday = cellStr === hoy;
      const score = isFuture ? 0 : getRehabDayScore(sesiones[cellStr]);
      const color = isFuture ? (isDark ? '#1e1e1e' : '#F0F0F0') : getHeatmapColor(score, isDark);
      const outline = isToday ? 'outline:2px solid var(--accent);outline-offset:1px;' : '';
      const opacity = isFuture ? 'opacity:0.25;cursor:default;' : '';
      const onclick = isFuture ? '' : ' onclick="showRehabHeatmapDay(\''+cellStr+'\')"';
      html += '<div class="rehab-heatmap-cell"'+onclick+' style="background:'+color+';'+outline+opacity+'"></div>';
    }
  }

  html += '</div>';
  html += '<div style="display:flex;gap:12px;margin-top:8px;font-size:10px;color:var(--muted);font-family:var(--font-mono);flex-wrap:wrap">'
    + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#2E7D32;vertical-align:middle;margin-right:3px"></span>100%</span>'
    + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#81C784;vertical-align:middle;margin-right:3px"></span>50%+</span>'
    + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#F9A825;vertical-align:middle;margin-right:3px"></span>&lt;50%</span>'
    + '<span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#E5E5E3;vertical-align:middle;margin-right:3px"></span>sin dato</span>'
    + '</div>'
    + '<div id="rehab-heatmap-tooltip" style="display:none" class="rehab-heatmap-tooltip"></div>'
    + '</div>';

  // Historial mediciones
  if (mediciones.length > 0) {
    html += '<div class="rehab-card">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">'
      + '<div class="rehab-title" style="margin-bottom:0">&#128197; Mediciones dominicales</div>'
      + '<button onclick="borrarMediciones()" style="font-size:11px;font-family:var(--font-mono);color:var(--muted);background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer">borrar todo</button>'
      + '</div>';
    var medRev = mediciones.slice().reverse().slice(0, 12);
    medRev.forEach(function(m, i) {
      const prev = medRev[i + 1];
      const delta = prev ? (m.valor - prev.valor) : null;
      const deltaStr = delta !== null
        ? '<span style="color:'+(delta>0?'var(--ok)':delta<0?'var(--accent2)':'var(--muted)')+';font-size:11px;margin-left:6px">'+(delta>0?'+':'')+delta.toFixed(1)+' cm</span>'
        : '';
      html += '<div class="rehab-history-row">'
        + '<span>'+m.fecha+'</span>'
        + '<span style="color:'+(m.valor>=TARGET_CM?'var(--ok)':'var(--accent)')+';font-weight:700">'+m.valor+' cm'+deltaStr+'</span>'
        + '</div>';
    });
    html += '</div>';
  }

  // Criterios re-ingreso
  const criterios = [
    { id: "dorsiflexion", label: "Dorsiflexion ≥ 7 cm (pierna izquierda)", auto: reached },
    { id: "equilibrio",   label: "Equilibrio monopodal ojos cerrados ≥ 45 s", auto: true },
    { id: "pistol",       label: "Pistol squat izquierdo inicia descenso sin bloqueo", auto: false },
  ];

  html += '<div class="rehab-card"><div class="rehab-title">&#10003; Criterios re-ingreso sentadilla</div>';
  criterios.forEach(function(c) {
    const isOk = c.auto || (datos.criterios && datos.criterios[c.id]);
    html += '<div class="rehab-criterion">'
      + '<div class="rehab-check '+(isOk?'ok':'')+'" onclick="toggleCriterio(\''+c.id+'\')">'+(isOk?'&#10003;':'')+'</div>'
      + '<span style="'+(isOk?'color:var(--ok)':'')+'">'+c.label+'</span>'
      + '</div>';
  });

  const allOk = criterios.every(function(c) { return c.auto || (datos.criterios && datos.criterios[c.id]); });
  if (allOk) {
    html += '<div style="margin-top:12px;padding:10px;background:var(--ok-bg);border-radius:8px;font-size:13px;color:var(--ok);font-weight:600;text-align:center">'
      + '&#127881; Listo para re-ingresar la sentadilla con barra'
      + '</div>';
  }
  html += '</div>';

  // Modal medicion
  html += '<div id="medicionModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:300;align-items:center;justify-content:center">'
    + '<div style="background:var(--card);border-radius:var(--radius);padding:20px;margin:20px;max-width:320px;width:100%">'
    + '<div style="font-family:var(--font-mono);font-size:12px;color:var(--accent);margin-bottom:12px">&#128207; MEDICION DOMINICAL</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-bottom:12px">Rodilla a pared · pie descalzo · talón en suelo<br>Distancia dedo gordo → pared en cm</div>'
    + '<input class="rehab-input" id="rehabCm" type="number" step="0.1" min="0" max="15" placeholder="ej: 4.5"'
    + ' style="width:100%;margin-bottom:10px;font-size:18px;text-align:center;padding:12px">'
    + '<div style="display:flex;gap:8px">'
    + '<button onclick="hideMedicionModal()" style="flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--muted);cursor:pointer">Cancelar</button>'
    + '<button onclick="saveRehabMedicion()" style="flex:1;padding:10px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer">Guardar</button>'
    + '</div></div></div>';

  html += '</div>';
  main.innerHTML = html;
}

function showRehabHeatmapDay(fechaStr) {
  const tooltip = document.getElementById('rehab-heatmap-tooltip');
  if (!tooltip) return;
  if (tooltip.dataset.fecha === fechaStr && tooltip.style.display !== 'none') {
    tooltip.style.display = 'none';
    return;
  }
  tooltip.dataset.fecha = fechaStr;
  const datos = getRehabDatos();
  const sesion = (datos.sesiones || {})[fechaStr] || {};
  let html = '<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted);margin-bottom:8px">'+fechaStr+'</div>';
  let hasAny = false;
  REHAB_EJERCICIOS.forEach(function(ej) {
    const sets = sesion[ej.id] || [];
    if (!sets.length) return;
    hasAny = true;
    const setsInfo = sets.map(function(s, i) {
      const norm = normalizeRehabSet(s, ej.objetivoSeg);
      if (!norm.completado) return 'S'+(i+1)+': -';
      const tStr = norm.tiempo != null ? norm.tiempo+'s' : 'hecho';
      const esFull = norm.tiempo == null || norm.tiempo >= ej.objetivoSeg;
      return 'S'+(i+1)+': '+tStr+(esFull ? '' : ' parcial');
    }).join(' · ');
    html += '<div style="margin-bottom:6px">'
      + '<div style="font-size:12px;font-weight:600">'+ej.nombre+'</div>'
      + '<div style="font-family:var(--font-mono);font-size:11px;color:var(--muted)">'+setsInfo+'</div>'
      + '</div>';
  });
  if (sesion.nota) {
    html += '<div style="font-size:11px;color:var(--muted);font-style:italic;border-top:1px solid var(--border);padding-top:6px;margin-top:4px">&ldquo;'+sesion.nota+'&rdquo;</div>';
  }
  if (!hasAny) {
    html += '<div style="color:var(--muted);font-size:12px">Sin registro este día</div>';
  }
  tooltip.innerHTML = html;
  tooltip.style.display = 'block';
}

function saveRehabSetTime(fecha, ejId, setIdx, tiempoStr) {
  const datos = getRehabDatos();
  if (!datos.sesiones) datos.sesiones = {};
  if (!datos.sesiones[fecha]) datos.sesiones[fecha] = {};
  const ej = REHAB_EJERCICIOS.find(function(e) { return e.id === ejId; });
  if (!ej) return;
  if (!datos.sesiones[fecha][ejId]) {
    datos.sesiones[fecha][ejId] = Array.from({length: ej.sets}, function() { return { tiempo: null, completado: false }; });
  }
  const tiempo = tiempoStr !== '' ? parseInt(tiempoStr, 10) : null;
  const prev = datos.sesiones[fecha][ejId][setIdx] || {};
  const wasCompletado = typeof prev === 'object' ? !!prev.completado : !!prev;
  datos.sesiones[fecha][ejId][setIdx] = {
    tiempo: (tiempo != null && !isNaN(tiempo) && tiempo >= 0) ? tiempo : null,
    completado: (tiempo > 0) || wasCompletado
  };
  saveRehabDatos(datos);
  queueSync();
  renderRehab(document.getElementById("mainContent"));
}

function toggleRehabSet(fecha, ejId, setIdx) {
  const datos = getRehabDatos();
  if (!datos.sesiones) datos.sesiones = {};
  if (!datos.sesiones[fecha]) datos.sesiones[fecha] = {};
  const ej = REHAB_EJERCICIOS.find(function(e) { return e.id === ejId; });
  if (!ej) return;
  if (!datos.sesiones[fecha][ejId]) {
    datos.sesiones[fecha][ejId] = Array.from({length: ej.sets}, function() { return { tiempo: null, completado: false }; });
  }
  const norm = normalizeRehabSet(datos.sesiones[fecha][ejId][setIdx], ej.objetivoSeg);
  datos.sesiones[fecha][ejId][setIdx] = { tiempo: norm.tiempo, completado: !norm.completado };
  saveRehabDatos(datos);
  queueSync();
  renderRehab(document.getElementById("mainContent"));
}

  if (!datos.sesiones) datos.sesiones = {};
  if (!datos.sesiones[fecha]) datos.sesiones[fecha] = {};
  datos.sesiones[fecha].nota = nota;
  saveRehabDatos(datos);
  queueSync();
}

// CUT — CUTTING PHASE
// ============================================================

const PLIEGUES_NAMES = [
  "Pecho","Axilar Media","Tríceps","Subescapular",
  "Abdominal","Suprailiaco","Muslo"
];

function getCutDatos() {
  try { return JSON.parse(localStorage.getItem(uk("cut-datos")) || "{}"); }
  catch(e) { return {}; }
}

function saveCutDatos(d) {
  localStorage.setItem(uk("cut-datos"), JSON.stringify(d));
}

// Jackson-Pollock 7 pliegues — fórmula varía por género
function calcGrasa7(pliegues, edad, genero) {
  const suma = pliegues.reduce((a,b) => a + b, 0);
  const densidad = (genero === 'mujer')
    ? 1.097 - (0.00046971 * suma) + (0.00000056 * suma * suma) - (0.00012828 * edad)
    : 1.112 - (0.00043499 * suma) + (0.00000055 * suma * suma) - (0.00028826 * edad);
  return ((4.95 / densidad) - 4.50) * 100;
}

// Pérdida semanal recomendada (extremo bajo)
function getPerdidaSemanal(pctGrasa) {
  if (pctGrasa > 15) return 0.5;
  if (pctGrasa >= 12) return 0.35;
  return 0.25;
}

// Targets de pliegues proporcionales al % grasa target
function calcPlieguTargets(pliegues, pctActual, pctTarget) {
  const ratio = pctTarget / pctActual;
  return pliegues.map(p => Math.round(p * ratio * 10) / 10);
}

function renderCut(main) {
  const datos = getCutDatos();
  const wrap = document.createElement('div');
  wrap.style.cssText = 'padding:16px;max-width:600px;margin:0 auto';

  if (!datos.setup) {
    renderCutWizard(wrap, datos);
  } else {
    renderCutDashboard(wrap, datos);
  }

  main.innerHTML = '';
  main.appendChild(wrap);
}

function wizardNext1() {
  const datos = getCutDatos();
  const get = id => parseFloat(document.getElementById(id)?.value);
  const pesoNoche = get('cw_pesoNoche');
  const pesoAyunas = get('cw_pesoAyunas');
  const pctTarget = get('cw_pctTarget');
  const ganMus = get('cw_ganMus');
  const cals = get('cw_cals');
  const edad = get('cw_edad') || 24;
  const fecha = document.getElementById('cw_fecha')?.value;
  const genero = document.querySelector('input[name="cw_genero"]:checked')?.value || 'hombre';

  if (!pesoNoche || !pesoAyunas || !pctTarget || !ganMus || !cals || !fecha) {
    showToast("Completa todos los campos", "err"); return;
  }

  datos.wizardPartial = { pesoNoche, pesoAyunas, pctTarget, ganMus, cals, edad, fecha, genero };
  datos.wizardStep = 2;
  saveCutDatos(datos);
  renderCut(document.getElementById('mainContent'));
}

function wizardNext2() {
  const datos = getCutDatos();
  const partial = datos.wizardPartial;
  const pliegues = PLIEGUES_NAMES.map((_,i) => parseFloat(document.getElementById(`pl_${i}`)?.value));
  const cintura = parseFloat(document.getElementById('pl_cintura')?.value);

  if (pliegues.some(isNaN) || isNaN(cintura)) {
    showToast("Completa todos los pliegues", "err"); return;
  }

  const edad = partial.edad || 24;
  const genero = partial.genero || 'hombre';
  const pctGrasaActual = calcGrasa7(pliegues, edad, genero);
  const masaMagra = partial.pesoAyunas * (1 - pctGrasaActual / 100);
  const masaMagraProyectada = masaMagra + partial.ganMus;
  const pesoTarget = masaMagraProyectada / (1 - partial.pctTarget / 100);
  const grasaActualKg = partial.pesoAyunas * (pctGrasaActual / 100);
  const grasaTargetKg = pesoTarget * (partial.pctTarget / 100);
  const grasaEliminar = grasaActualKg - grasaTargetKg;
  const perdidaSemanal = getPerdidaSemanal(pctGrasaActual);
  const semanas = Math.ceil(grasaEliminar / perdidaSemanal);
  const deficitDiario = Math.round(perdidaSemanal * 7700 / 7);

  // Top 3 pliegues más altos
  const indexedPliegues = pliegues.map((v,i) => ({ i, v, nombre: PLIEGUES_NAMES[i] }));
  indexedPliegues.sort((a,b) => b.v - a.v);
  const top3 = indexedPliegues.slice(0,3);
  const plieguTargets = calcPlieguTargets(pliegues, pctGrasaActual, partial.pctTarget);
  const topPliegues = top3.map(p => ({
    nombre: p.nombre, actual: p.v, target: plieguTargets[p.i], idx: p.i
  }));

  // Generar calendario semanal
  const calendario = [];
  const startDate = new Date(partial.fecha);
  let pesoNocheActual = partial.pesoNoche;
  let pesoAyunasActual = partial.pesoAyunas;
  for (let s = 1; s <= semanas; s++) {
    const weekStart = new Date(startDate);
    weekStart.setDate(startDate.getDate() + (s-1)*7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const mesesFmt = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const fmt = d => `${d.getDate()} ${mesesFmt[d.getMonth()]}`;
    pesoNocheActual = Math.round((pesoNocheActual - perdidaSemanal) * 10) / 10;
    pesoAyunasActual = Math.round((pesoAyunasActual - perdidaSemanal) * 10) / 10;
    calendario.push({
      semana: s,
      fechaStr: `${fmt(weekStart)} – ${fmt(weekEnd)}`,
      targetNoche: pesoNocheActual,
      targetAyunas: pesoAyunasActual,
    });
  }

  datos.wizardResumen = {
    pctGrasaActual, pctTarget: partial.pctTarget, masaMagra,
    pesoTarget, grasaEliminar, perdidaSemanal, semanas, deficitDiario,
    topPliegues, cinturaActual: cintura, plieguesIniciales: pliegues,
    plieguTargets, cals: partial.cals, genero
  };
  datos.wizardStep = 3;
  saveCutDatos(datos);
  renderCut(document.getElementById('mainContent'));
}

function cancelEdit() {
  const datos = getCutDatos();
  delete datos.wizardStep;
  delete datos.wizardPartial;
  delete datos.wizardPliegues;

function wizardBack(step) {
  const datos = getCutDatos();

function wizardConfirm() {
  const datos = getCutDatos();
  const r = datos.wizardResumen;
  const partial = datos.wizardPartial;

  // Generar calendario
  const calendario = [];
  const [sy, sm, sd] = partial.fecha.split('-').map(Number);
  const startDate = new Date(sy, sm-1, sd);
  let pesoNoche = partial.pesoNoche;
  let pesoAyunas = partial.pesoAyunas;
  for (let s = 1; s <= r.semanas; s++) {
    const weekStart = new Date(startDate);
    weekStart.setDate(startDate.getDate() + (s-1)*7);
    const weekEnd = new Date(weekStart);
    weekEnd.setDate(weekStart.getDate() + 6);
    const mesesFmt = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const fmt = d => `${d.getDate()} ${mesesFmt[d.getMonth()]}`;
    pesoNoche = Math.round((pesoNoche - r.perdidaSemanal) * 10) / 10;
    pesoAyunas = Math.round((pesoAyunas - r.perdidaSemanal) * 10) / 10;
    calendario.push({
      semana: s,
      fechaStr: `${fmt(weekStart)} – ${fmt(weekEnd)}`,
      targetNoche: pesoNoche,
      targetAyunas: pesoAyunas,
    });
  }

  datos.setup = {
    ...partial,
    ...r,
    calendario,
    fechaInicio: partial.fecha,
  };
  datos.registrosDiarios = {};
  datos.registrosSemanales = {};
  datos.registrosMensuales = {};
  delete datos.wizardStep;
  delete datos.wizardPartial;
  delete datos.wizardResumen;
  saveCutDatos(datos);
  // Dolly confirmó su propio setup: desbloquear pulls futuros de cut
  localStorage.removeItem('forge-cut-pull-blocked-' + state.currentUser);
  queueSync();
  showToast("Cutting Phase iniciada ✓", "ok");
  renderCut(document.getElementById('mainContent'));
}

// ── DASHBOARD ──
function renderCutDashboard(wrap, datos) {
  const s = datos.setup;
  const hoy = (() => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })();
  const registros = datos.registrosDiarios || {};
  const semanales = datos.registrosSemanales || {};

  // Semana actual
  const [_iy, _im, _id] = s.fechaInicio.split('-').map(Number);
  const inicio = new Date(_iy, _im-1, _id);
  const [_hy, _hm, _hd] = hoy.split('-').map(Number);
  const hoyDate = new Date(_hy, _hm-1, _hd);
  const diasTranscurridos = Math.floor((hoyDate - inicio) / (1000*60*60*24));
  const semanaActual = Math.min(Math.floor(diasTranscurridos / 7) + 1, s.semanas);
  const semanaInfo = s.calendario[semanaActual - 1];

  // Promedio peso esta semana
  const diasSemana = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(inicio);
    d.setDate(inicio.getDate() + (semanaActual-1)*7 + i);
    diasSemana.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  const pesosNoche = diasSemana.map(d => registros[d]?.noche).filter(Boolean);
  const pesosAyunas = diasSemana.map(d => registros[d]?.ayunas).filter(Boolean);
  const promNoche = pesosNoche.length ? (pesosNoche.reduce((a,b)=>a+b,0)/pesosNoche.length) : null;
  const promAyunas = pesosAyunas.length ? (pesosAyunas.reduce((a,b)=>a+b,0)/pesosAyunas.length) : null;

  // % progreso basado en peso real vs objetivo
  const pesoInicial = s.pesoAyunas;
  const pesoFinal = s.calendario[s.semanas - 1]?.targetAyunas || pesoInicial;
  const totalBajar = pesoInicial - pesoFinal;
  // Usar el promedio de ayunas más reciente disponible
  let mejorPromedio = null;
  for (let i = semanaActual; i >= 1; i--) {
    const p = semanales['S'+i]?.promAyunas;
    if (p) { mejorPromedio = p; break; }
  }
  const bajado = mejorPromedio ? Math.max(0, pesoInicial - mejorPromedio) : 0;
  const pct = totalBajar > 0 ? Math.min(100, Math.round((bajado / totalBajar) * 100)) : 0;

  // Alerta calorica
  let alertaCalorica = '';
  if (semanaActual > 1 && promAyunas !== null) {
    const semanaAnterior = s.calendario[semanaActual - 2];
    const diffReal = semanaAnterior.targetAyunas - promAyunas;
    const diffEsperado = s.perdidaSemanal;
    if (diffReal < diffEsperado * 0.5) {
      const ajuste = Math.round((diffEsperado - diffReal) * 7700 / 7 / 50) * 50;
      alertaCalorica = `<div class="cut-alert warn">⚠️ El peso no bajó lo esperado esta semana. Considera reducir ~${ajuste} kcal/día (de ${s.cals} a ${s.cals - ajuste} kcal).</div>`;
    } else if (diffReal >= diffEsperado * 0.9) {
      alertaCalorica = `<div class="cut-alert ok">✓ Bajada en línea con el plan esta semana.</div>`;
    }
  }

  const pesoFinalTarget = s.calendario[s.semanas - 1]?.targetAyunas;
  let html = `
  <!-- HEADER -->
  <div class="cut-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <div>
        <div style="font-size:11px;font-family:var(--font-mono);color:var(--accent2)">CUTTING PHASE · SEMANA ${semanaActual} DE ${s.semanas}</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px">${semanaInfo?.fechaStr || ''}</div>
      </div>
      <div style="display:flex;gap:6px">
        <button onclick="resetCut()" style="font-size:10px;font-family:var(--font-mono);color:var(--accent2);background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;cursor:pointer">Reiniciar</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <div>
        <span style="font-family:var(--font-mono);font-size:22px;font-weight:700">${mejorPromedio ? mejorPromedio.toFixed(1)+' kg' : s.pesoAyunas+' kg'}</span>
        <span style="font-size:12px;color:var(--muted);margin-left:4px">Actual</span>
      </div>
      <div style="text-align:right">
        <span style="font-family:var(--font-mono);font-size:18px;font-weight:700;color:var(--ok)">${pesoFinalTarget} kg</span>
        <span style="font-size:12px;color:var(--muted);margin-left:4px">Objetivo</span>
      </div>
    </div>

function savePesoDiario(fecha) {
  const ayunas = parseFloat(document.getElementById('peso_ayunas')?.value);
  const noche = parseFloat(document.getElementById('peso_noche')?.value);
  if (!ayunas && !noche) { showToast("Ingresa al menos un peso", "err"); return; }

  const datos = getCutDatos();
  if (!datos.registrosDiarios) datos.registrosDiarios = {};
  datos.registrosDiarios[fecha] = { ayunas: ayunas||null, noche: noche||null };

  // Actualizar promedio en registro semanal
  const s = datos.setup;
  const [iy, im, id] = s.fechaInicio.split('-').map(Number);
  const inicio = new Date(iy, im-1, id);
  const [hy, hm, hd] = fecha.split('-').map(Number);
  const hoyDate = new Date(hy, hm-1, hd);
  const dias = Math.floor((hoyDate - inicio) / (1000*60*60*24));
  const semana = Math.min(Math.floor(dias / 7) + 1, s.semanas);

  const diasSemana = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(inicio);
    d.setDate(inicio.getDate() + (semana-1)*7 + i);
    diasSemana.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  }
  const pesosAyunas = diasSemana.map(d => datos.registrosDiarios[d]?.ayunas).filter(Boolean);
  const pesosNoche = diasSemana.map(d => datos.registrosDiarios[d]?.noche).filter(Boolean);

  if (!datos.registrosSemanales) datos.registrosSemanales = {};
  if (!datos.registrosSemanales[`S${semana}`]) datos.registrosSemanales[`S${semana}`] = {};
  if (pesosAyunas.length) datos.registrosSemanales[`S${semana}`].promAyunas = Math.round(pesosAyunas.reduce((a,b)=>a+b,0)/pesosAyunas.length*10)/10;
  if (pesosNoche.length) datos.registrosSemanales[`S${semana}`].promNoche = Math.round(pesosNoche.reduce((a,b)=>a+b,0)/pesosNoche.length*10)/10;

  saveCutDatos(datos);
  showToast("Peso guardado ✓", "ok");
  renderCut(document.getElementById('mainContent'));
}

function savePlieguesSemana(semana) {
  const datos = getCutDatos();
  const s = datos.setup;
  const pliegues = s.topPliegues.map((_,i) => parseFloat(document.getElementById(`pls_${i}`)?.value) || null);
  const cintura = parseFloat(document.getElementById('pls_cintura')?.value) || null;

  if (!datos.registrosSemanales) datos.registrosSemanales = {};
  if (!datos.registrosSemanales[`S${semana}`]) datos.registrosSemanales[`S${semana}`] = {};
  datos.registrosSemanales[`S${semana}`].pliegues = pliegues;
  datos.registrosSemanales[`S${semana}`].cintura = cintura;

  saveCutDatos(datos);
  showToast("Pliegues guardados ✓", "ok");
}

function clearDailyRecords() {
  if (!confirm("¿Borrar todos los registros de peso diario? El setup y calendario se conservan.")) return;
  const datos = getCutDatos();
  datos.registrosDiarios = {};
  datos.registrosSemanales = {};
  saveCutDatos(datos);
  showToast("Registros borrados ✓", "ok");
  renderCut(document.getElementById('mainContent'));
}

function resetCut() {
  if (!confirm("¿Reiniciar la Cutting Phase? Se borrarán todos los datos.")) return;
  localStorage.removeItem(uk("cut-datos"));
  showToast("Cutting Phase reiniciada", "ok");

}

function formatTestResultRM(ej, r) {
  if (!r) return '—';
  const parts = [];
  if (r.variante_lograda) parts.push(r.variante_lograda);
  if (r.nivel_asistencia) parts.push(r.nivel_asistencia);
  if (r.peso_kg) parts.push(r.peso_kg + ' kg');
  if (r.tiempo_segundos) parts.push(r.tiempo_segundos + ' seg');
  if (r.segundos_bajada) parts.push(r.segundos_bajada + 's excéntrico');
  if (r.reps) parts.push('× ' + r.reps + ' reps');
  if (r.reps_logradas) parts.push('× ' + r.reps_logradas + ' reps');
  if (r.reps_pierna_derecha || r.reps_pierna_izquierda) {
    parts.push('× ' + (r.reps_pierna_derecha || '?') + '/' + (r.reps_pierna_izquierda || '?') + ' der/izq');
  }
  return parts.join(' ');
}

function guardarNombrePerfil(valor) {
  const d = getProfileDatos();
  d.displayName = valor.trim();
  saveProfileDatos(d);
}
function guardarFotoPerfil(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const size = 80;
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      const min = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width - min) / 2, (img.height - min) / 2, min, min, 0, 0, size, size);
      const d = getProfileDatos();
      d.photoData = canvas.toDataURL('image/jpeg', 0.85);
      saveProfileDatos(d);
      renderProfile(document.getElementById('mainContent'));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

      <div class="cut-field">

      <div class="cut-field">

      <div class="cut-field">
        <div class="cut-label">${n}</div>

      <div class="cut-field">
